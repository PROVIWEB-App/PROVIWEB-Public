<script>
// Global callback for Google Maps - must be defined before the script loads
window.initMap = function() {
    // This will be called after Google Maps API loads
    console.log('Google Maps API loaded');
    // Initialize map when ready (initializeMap lives in module scope, expose it on window)
    if (typeof window.initializeMap === 'function') {
        setTimeout(() => window.initializeMap(), 50);
    } else {
        console.warn('initializeMap aún no está disponible; el módulo debe cargar primero.');
    }
};

// If the API key is restricted / invalid, Google calls this
window.gm_authFailure = function() {
    console.error('Google Maps auth failure (API key / referrer restriction)');
    const overlay = document.createElement('div');
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(15,15,19,0.9);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Inter',sans-serif;";
    overlay.innerHTML = `
        <div style="background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glass);border-radius:14px;max-width:500px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);">
            <div style="font-weight:700;font-size:16px;margin-bottom:10px;color:#d32f2f;">⚠️ Error de Autenticación</div>
            <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:15px;">
                La API key no pudo autenticarse. Verifica:<br>
                • Que la key sea de tipo <b>Web (HTTP referrers)</b><br>
                • Que <b>Maps JavaScript API</b> y <b>Places API</b> estén habilitadas<br>
                • Que tu URL esté en la lista de referrers permitidos
            </div>
            <button onclick="this.parentElement.parentElement.remove();location.reload();" style="width:100%;padding:10px;background:linear-gradient(135deg, #a855f7 0%, #007BFF 100%);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;">Recargar</button>
        </div>
    `;
    document.body.appendChild(overlay);
};
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBcE8-9AWMXNVSyIAhDK8ZLwpCigfgZKJM&libraries=places,geometry&callback=initMap" async defer></script>

// Initialize map
function initializeMap() {
    if (typeof google === 'undefined' || typeof google.maps === 'undefined') {
        console.error('Google Maps API not loaded, retrying...');
        setTimeout(initializeMap, 500);
        return;
    }
    
    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 4.6097, lng: -74.0817 }, // Bogotá default
        zoom: 12,
        // Vista estilo Google Earth (satelital/3D)
        mapTypeId: 'satellite', // 'satellite', 'hybrid', 'terrain', 'roadmap'
        mapTypeControl: true, // Permite cambiar entre tipos de mapa
        mapTypeControlOptions: {
            style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
            position: google.maps.ControlPosition.TOP_RIGHT,
            mapTypeIds: [
                google.maps.MapTypeId.ROADMAP,
                google.maps.MapTypeId.SATELLITE,
                google.maps.MapTypeId.HYBRID,
                google.maps.MapTypeId.TERRAIN
            ]
        },
        streetViewControl: true, // Control de Street View
        streetViewControlOptions: {
            position: google.maps.ControlPosition.RIGHT_TOP
        },
        fullscreenControl: true, // Control de pantalla completa
        fullscreenControlOptions: {
            position: google.maps.ControlPosition.RIGHT_TOP
        },
        // Opciones para vista 3D estilo Google Earth
        tilt: 0, // Inclinación (0-45 grados) - se puede ajustar con gestos
        heading: 0, // Rotación (0-360 grados)
        // Habilitar gestos 3D (usa 'greedy' para zoom normal con scroll, o 'cooperative' para Ctrl+scroll)
        gestureHandling: 'greedy',
        // Configuración de UI
        zoomControl: true,
        zoomControlOptions: {
            position: google.maps.ControlPosition.RIGHT_CENTER
        },
        // Estilos adicionales para mejor visualización
        disableDefaultUI: false
    });
    
    // Configurar vista 3D cuando el zoom sea alto (estilo Google Earth)
    map.addListener('zoom_changed', () => {
        const currentZoom = map.getZoom();
        // A mayor zoom, más inclinación para efecto 3D (solo en vista satelital/híbrida)
        if (map.getMapTypeId() === 'satellite' || map.getMapTypeId() === 'hybrid') {
            if (currentZoom >= 18) {
                // Vista 3D con inclinación (estilo Google Earth)
                map.setTilt(45);
            } else if (currentZoom >= 15) {
                map.setTilt(30);
            } else if (currentZoom >= 12) {
                map.setTilt(15);
            } else {
                map.setTilt(0);
            }
        }
    });
    
    // Cambiar a vista híbrida cuando se cambia el tipo de mapa (mejor para ver calles + satélite)
    map.addListener('maptypeid_changed', () => {
        const mapType = map.getMapTypeId();
        console.log('Map type changed to:', mapType);
        // Si cambia a roadmap o terrain, resetear tilt
        if (mapType === 'roadmap' || mapType === 'terrain') {
            map.setTilt(0);
        }
        // Actualizar estado del botón
        updateEarthViewButton();
    });
    
    // Botón para alternar vista Google Earth (3D)
    const earthViewBtn = document.getElementById('earthViewBtn');
    let earthViewActive = false;
    
    function updateEarthViewButton() {
        const mapType = map.getMapTypeId();
        const isSatellite = mapType === 'satellite' || mapType === 'hybrid';
        earthViewActive = isSatellite;
        
        if (earthViewBtn) {
            if (earthViewActive) {
                earthViewBtn.classList.add('active');
                earthViewBtn.title = 'Cambiar a vista normal';
            } else {
                earthViewBtn.classList.remove('active');
                earthViewBtn.title = 'Vista Google Earth (3D)';
            }
        }
    }
    
    if (earthViewBtn) {
        earthViewBtn.addEventListener('click', () => {
            const currentMapType = map.getMapTypeId();
            
            if (currentMapType === 'satellite' || currentMapType === 'hybrid') {
                // Cambiar a vista normal (roadmap)
                map.setMapTypeId('roadmap');
                map.setTilt(0);
                map.setHeading(0);
                earthViewActive = false;
                earthViewBtn.classList.remove('active');
                earthViewBtn.title = 'Vista Google Earth (3D)';
                console.log('Cambiado a vista normal');
            } else {
                // Cambiar a vista Google Earth (satelital/híbrida con 3D)
                map.setMapTypeId('hybrid'); // 'hybrid' muestra satélite + calles
                // Aplicar vista 3D si el zoom es alto
                const currentZoom = map.getZoom();
                if (currentZoom >= 15) {
                    map.setTilt(45);
                } else if (currentZoom >= 12) {
                    map.setTilt(30);
                }
                earthViewActive = true;
                earthViewBtn.classList.add('active');
                earthViewBtn.title = 'Cambiar a vista normal';
                console.log('Cambiado a vista Google Earth (3D)');
            }
        });
        
        // Inicializar estado del botón
        updateEarthViewButton();
    }

    boundsBuilder = new google.maps.LatLngBounds();

    // Load options
    loadOptions();
    
    // Get current location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const currentLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
            };
            
            map.setCenter(currentLocation);
            map.setZoom(15);
            
            // Add current user marker
            currentUserMarker = new google.maps.Marker({
                position: currentLocation,
                map: map,
                title: 'Tu ubicación',
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                        <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="18" fill="#007BFF" stroke="white" stroke-width="2"/>
                            <circle cx="20" cy="20" r="8" fill="white"/>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(40, 40)
                }
            });
        });
    }

    // Load initial data
    onAuthStateChanged(auth, user => {
        if (!user) {
            window.location.href = 'index.html';
            return;
        }
        currentUID = user.uid;
        loadUserLocations();
        // Precarga lista de grupos (se muestra al filtrar "Mariachis")
        loadMariachisGroups();
        cargarCotizaciones();
        leerSerenataComprador();
    });
}

// Expose for the global Google callback (initMap)
window.initializeMap = initializeMap;

// Wait for Google Maps to load
// Check if Google Maps is already loaded (in case script loads before module)
if (typeof google !== 'undefined' && typeof google.maps !== 'undefined') {
    initializeMap();
} else {
    // Wait for the callback or check periodically
    const checkInterval = setInterval(() => {
        if (typeof google !== 'undefined' && typeof google.maps !== 'undefined') {

// Load filter options
function loadOptions() {
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    
    mapOptions.forEach(option => {
        const item = document.createElement('div');
        item.className = 'option-item';

// Load user locations
function loadUserLocations() {
    showLoading();
    const userLocationsRef = ref(db, 'UserLocation');
    const usersListContainer = document.getElementById('usersListContainer');
    const usersList = document.getElementById('usersList');
    usersList.innerHTML = '';
    
    onValue(userLocationsRef, (snapshot) => {
        hideLoading();
        clearMarkers();
        boundsBuilder = new google.maps.LatLngBounds();
        const usersArray = [];
        
        if (!snapshot.exists()) {
            usersListContainer.classList.remove('show');
            return;
        }
        
        snapshot.forEach((userSnap) => {
            const userId = userSnap.key;
            if (userId === currentUID) return;
            
            const lat = userSnap.child('latitude').val();
            const lng = userSnap.child('longitude').val();
            
            if (lat && lng) {
                const location = { lat, lng };
                boundsBuilder.extend(location);
                usersArray.push({ userId, location });
                loadUserDataAndAddMarker(location, userId);
            }
        });
        
        // Load users list
        if (usersArray.length > 0) {
            loadUsersList(usersArray);
            usersListContainer.classList.add('show');
        } else {
            usersListContainer.classList.remove('show');
        }
        
        if (boundsBuilder.getNorthEast()) {
            map.fitBounds(boundsBuilder);
        }
    });
}

// MariachiAdapter (web): carga grupos desde GrupMusicRegis y User (foto/username)
async function loadMariachisGroups() {
    if (!currentUID) return;

    const container = document.getElementById('mariachiGroups');
    container.innerHTML = '';

    // Intentamos soportar ambas estructuras:
    // A) GrupMusicRegis/{uid}/{groupId}/{...}
    // B) GrupMusicRegis/{pk}/{uid}/{...}  (como tu loop pkSnapshot->userSnapshot en Android)
    const rootSnap = await get(ref(db, 'GrupMusicRegis'));
    if (!rootSnap.exists()) {
        document.getElementById('mariachiGroupsContainer').classList.remove('show');
        return;
    }

    const groups = [];

    // Caso A: si existe hijo currentUID, puede ser estructura A; pero aquí queremos TODOS los grupos (mariachis).
    // Recorremos 2 niveles máximo y detectamos nodos que parezcan "grupo" (tengan name/precio/ubicacion/cantidad).
    rootSnap.forEach((level1) => {
        const v1 = level1.val();
        if (!v1) return;

        // Si level1 es uid directo y su valor es un objeto de grupos
        if (typeof v1 === 'object' && (v1.name || v1.precio || v1.ubicacion || v1.cantidad)) {
            // Nodo directo tipo grupo (raro, pero lo aceptamos)
            groups.push({ uid: level1.key, ...v1 });
            return;
        }

        // Si v1 parece ser {groupId: {...}} o {uid: {...}} (caso A o B)
        if (typeof v1 === 'object') {
            level1.forEach?.((level2) => {
                const v2 = level2.val();
                if (!v2 || typeof v2 !== 'object') return;

                // Caso A: level1.key = uid, level2 = group
                const looksLikeGroup = !!(v2.name || v2.precio || v2.ubicacion || v2.cantidad || v2.description);
                if (looksLikeGroup) {
                    groups.push({ uid: level1.key, ...v2 });
                    return;
                }

                // Caso B: level1.key = pk, level2.key = uid, level2 = {groupId: {...}}
                level2.forEach?.((level3) => {
                    const v3 = level3.val();
                    if (!v3 || typeof v3 !== 'object') return;
                    const looksLikeGroup3 = !!(v3.name || v3.precio || v3.ubicacion || v3.cantidad || v3.description);
                    if (looksLikeGroup3) {
                        groups.push({ uid: level2.key, ...v3 });
                    }
                });
            });
        }
    });

    // Filtramos duplicados por uid+name+precio+ubicacion (para no mostrar repetidos si detectamos por dos rutas)
    const seen = new Set();
    const uniqueGroups = groups.filter(g => {
        const k = `${g.uid}|${g.name || ''}|${g.precio || ''}|${g.ubicacion || ''}`;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
    });

    // Render tipo MariachiAdapter
    for (const g of uniqueGroups) {
        if (!g.uid || g.uid === currentUID) continue;

        const userSnap = await get(ref(db, `Users/${g.uid}`));
        const user = userSnap.exists() ? userSnap.val() : {};
        const username = user?.username || 'Sin nombre';
        const defaultAvatar = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
        const photoUrl = (user?.photo && user.photo.trim()) ? user.photo : defaultAvatar;

        const card = document.createElement('div');
        card.className = 'mariachi-card';
        card.innerHTML = `
            <div class="mariachi-card-head">
                <img class="mariachi-card-photo" src="${photoUrl}" alt="${username}" />
                <div class="mariachi-card-title">
                    <div class="mariachi-card-name">${(g.name || 'Grupo')}</div>
                    <div class="mariachi-card-username">@${username}</div>
                </div>
            </div>
            <div class="mariachi-card-meta">
                <div><strong>Precio:</strong> ${getCurrencyPrefix(g.ubicacion)}${g.precio || '0'}</div>
                <div><strong>Ubicación:</strong> ${g.ubicacion || 'N/A'}</div>
                <div><strong>Músicos:</strong> ${g.cantidad || '0'}</div>
            </div>
        `;

        card.addEventListener('click', () => {
            // En Android al hacer click puedes abrir detalles / interactuar con mapa.
            // Aquí: centramos el mapa a la ubicación del uid y abrimos el bottom sheet.
            const locRef = ref(db, `UserLocation/${g.uid}`);
            onValue(locRef, (locSnap) => {
                if (locSnap.exists()) {
                    const lat = locSnap.child('latitude').val();
                    const lng = locSnap.child('longitude').val();
                    if (lat && lng && map) {
                        map.panTo({ lat, lng });
                        map.setZoom(15);
                    }
                }
            }, { onlyOnce: true });

            showBottomSheet({
                photoUrl,
                username,

// Follow user
async function followUser(userId, btn) {
    if (!currentUID) return;
    
    await set(ref(db, `Follow/${currentUID}/Following/${userId}`), true);
    await set(ref(db, `Follow/${userId}/Followers/${currentUID}`), true);
    
    // Notify user
    const userRef = ref(db, `Users/${currentUID}`);
    onValue(userRef, (userSnap) => {
        if (userSnap.exists()) {
            const userName = userSnap.val().name || 'Usuario';
            const timestamp = Date.now().toString();
            const notificationRef = ref(db, `Users/${userId}/Notifications/${timestamp}`);
            set(notificationRef, {
                pId: userId,
                timestamp: timestamp,
                pUid: userId,
                notification: 'Empezó a seguirte',
                type: 'follow',
                sUid: currentUID
            });
            set(ref(db, `Users/${userId}/Count/${timestamp}`), true);

    if (btn) btn.style.display = 'none';
}

// Add user marker with circular profile photo (like Android)
function addUserMarker(location, photoUrl, username, name, instrument, generoMusic, status, userId) {
    // Default avatar if no photo
    const defaultAvatar = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
    
    // Validate photo URL
    let finalPhotoUrl = photoUrl;
    if (!finalPhotoUrl || typeof finalPhotoUrl !== 'string' || !finalPhotoUrl.trim()) {
        finalPhotoUrl = defaultAvatar;
    } else {
        finalPhotoUrl = finalPhotoUrl.trim();
        if (!finalPhotoUrl.startsWith('http://') && !finalPhotoUrl.startsWith('https://')) {
            console.warn('Invalid photo URL for marker:', finalPhotoUrl);
            finalPhotoUrl = defaultAvatar;
        }
    }
    
    console.log('Creating marker for user:', name || username, 'Photo URL:', finalPhotoUrl);
    
    const size = 60;
    const badgeSize = 18;
    const radius = size / 2 - 2;
    
    // Helper function to create marker icon from loaded image
    function createMarkerIconFromImage(imgElement) {
        console.log('Creating marker icon from image. Image state:', {
            complete: imgElement.complete,
            naturalWidth: imgElement.naturalWidth,
            naturalHeight: imgElement.naturalHeight,
            width: imgElement.width,
            height: imgElement.height
        });
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = size;
        canvas.height = size;
        
        // Draw white background circle
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
        ctx.fill();
        
        // Draw circular photo - ensure image is loaded and has valid dimensions
        const hasValidImage = imgElement.complete && 
                              imgElement.naturalWidth > 0 && 
                              imgElement.naturalHeight > 0;
        
        if (hasValidImage) {
            console.log('Drawing image on canvas. Image dimensions:', imgElement.naturalWidth, 'x', imgElement.naturalHeight);
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
            ctx.clip();
            
            // Calculate scaling to fill circle while maintaining aspect ratio
            const imgAspect = imgElement.naturalWidth / imgElement.naturalHeight;
            let drawWidth, drawHeight, drawX, drawY;
            
            if (imgAspect > 1) {
                // Image is wider - fit to height
                drawHeight = size - 4;
                drawWidth = drawHeight * imgAspect;
                drawX = (size - drawWidth) / 2;
                drawY = 2;
            } else {
                // Image is taller - fit to width
                drawWidth = size - 4;
                drawHeight = drawWidth / imgAspect;
                drawX = 2;
                drawY = (size - drawHeight) / 2;
            }
            
            console.log('Drawing image at:', { drawX, drawY, drawWidth, drawHeight });
            
            // Draw the image
            try {
                ctx.drawImage(imgElement, drawX, drawY, drawWidth, drawHeight);
                console.log('✅ Image drawn successfully on canvas');
            } catch (e) {
                console.error('❌ Error drawing image on canvas:', e);
                // Fill with a color as fallback
                ctx.fillStyle = '#E0E0E0';
                ctx.fillRect(drawX, drawY, drawWidth, drawHeight);
            }
            ctx.restore();
        } else {
            console.warn('Image not ready or invalid, filling with gray');
            ctx.save();
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
            ctx.clip();
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(2, 2, size - 4, size - 4);
            ctx.restore();
        }
        
        // Add blue border
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#007BFF';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        const dataUrl = canvas.toDataURL('image/png');
        console.log('Canvas created, data URL length:', dataUrl.length);
        
        return {
            url: dataUrl,
            scaledSize: new google.maps.Size(size, size),
            anchor: new google.maps.Point(size / 2, size / 2)
        };
    }
    
    // Function to create marker with icon
    function createMarkerWithIcon(iconConfig) {
        const marker = new google.maps.Marker({
            position: location,
            map: map,
            title: name || username || 'Usuario',
            icon: iconConfig,
            animation: google.maps.Animation.DROP,
            optimized: false
        });
        
        // Store user info in marker
        marker.userInfo = {
            photoUrl: finalPhotoUrl,
            username,
            name,
            instrument,
            generoMusic,
            status,
            userId
        };
        
        markers.push(marker);
        
        // Click listener
        marker.addListener('click', () => {
            showBottomSheet(marker.userInfo);
        });
        
        // Add badge overlay if user is verified (load async)
        addUserTypeBadge(marker, userId, size, badgeSize);
    }
    
    // Create default marker with initial (fallback)
    function createDefaultMarkerWithInitial() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = size;
        canvas.height = size;
        
        // White background circle
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
        ctx.fill();
        
        // Blue circle for initial
        ctx.fillStyle = '#007BFF';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, radius - 2, 0, 2 * Math.PI);
        ctx.fill();
        
        // White text with first letter
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 24px Roboto, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const initial = (name || username || 'U').charAt(0).toUpperCase();
        ctx.fillText(initial, size / 2, size / 2);
        
        // Blue border
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#007BFF';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        const markerIcon = {
            url: canvas.toDataURL('image/png'),
            scaledSize: new google.maps.Size(size, size),
            anchor: new google.maps.Point(size / 2, size / 2)
        };
        
        createMarkerWithIcon(markerIcon);
    }
    
    // Load user photo and create marker
    // Firebase Storage URLs usually work without CORS issues
    const img = new Image();
    let markerCreated = false;
    let loadingAttempted = false;
    
    function createMarkerFromImage(imageElement) {
        if (markerCreated) {
            console.log('Marker already created, skipping duplicate');
            return; // Prevent duplicate markers
        }
        
        // Double check image is ready
        if (!imageElement.complete) {
            console.warn('Image not complete yet, waiting...');
            imageElement.onload = function() {
                createMarkerFromImage(imageElement);
            };
            return;
        }
        
        console.log('✅ Image loaded successfully for marker:', finalPhotoUrl);
        console.log('Image state:', {
            complete: imageElement.complete,
            naturalWidth: imageElement.naturalWidth,
            naturalHeight: imageElement.naturalHeight,
            width: imageElement.width,
            height: imageElement.height
        });
        
        // Verify image actually loaded with valid dimensions
        if (imageElement.naturalWidth === 0 || imageElement.naturalHeight === 0) {
            console.warn('⚠️ Image has zero dimensions, using default');
            if (!markerCreated) {
                createDefaultMarkerWithInitial();
                markerCreated = true;
            }
            return;
        }
        
        try {
            const markerIcon = createMarkerIconFromImage(imageElement);
            createMarkerWithIcon(markerIcon);
            markerCreated = true;
            console.log('✅ Marker created with photo for user:', name || username);
        } catch (e) {
            console.error('❌ Error creating marker icon from image:', e);
            console.error('Error details:', e.message, e.stack);
            if (!markerCreated) {
                createDefaultMarkerWithInitial();
                markerCreated = true;
            }
        }
    }
    
    // Try loading image - Firebase Storage URLs usually work directly
    img.onload = function() {
        console.log('📸 Image onload event fired for:', finalPhotoUrl);
        // Small delay to ensure image is fully decoded
        setTimeout(() => {
            createMarkerFromImage(img);
        }, 100);
    };
    
    img.onerror = function(e) {
        console.warn('⚠️ Image load error for:', finalPhotoUrl);
        console.warn('Error event:', e);
        
        if (markerCreated) return;
        
        // Try with CORS as fallback
        console.log('Retrying with CORS...');
        const imgCORS = new Image();
        imgCORS.crossOrigin = 'anonymous';
        
        imgCORS.onload = function() {
            console.log('✅ Image loaded with CORS:', finalPhotoUrl);
            setTimeout(() => {
                createMarkerFromImage(imgCORS);
            }, 100);
        };
        
        imgCORS.onerror = function() {
            console.error('❌ Failed even with CORS, using default marker with initial');
            if (!markerCreated) {
                createDefaultMarkerWithInitial();
                markerCreated = true;
            }
        };
        
        // Try with CORS
        imgCORS.src = finalPhotoUrl;
    };
    
    // Start loading image - Firebase Storage URLs should work without CORS
    console.log('🔄 Loading image for marker - User:', name || username, 'URL:', finalPhotoUrl);
    loadingAttempted = true;
    img.src = finalPhotoUrl;
    
    // Timeout fallback - if nothing loads in 10 seconds, use default
    setTimeout(() => {
        if (!markerCreated && loadingAttempted) {
            console.warn('⏱️ Timeout (10s): Image took too long to load, using default marker');
            console.warn('URL that failed:', finalPhotoUrl);
            console.warn('Image state:', {
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight
            });
            createDefaultMarkerWithInitial();
            markerCreated = true;
        }
    }, 10000);
}

// Add user type badge to marker (like setTypeUser in Android)
function addUserTypeBadge(marker, userId, markerSize, badgeSize) {
    if (!userId || !marker) return;
    
    const userRef = ref(db, `Users/${userId}`);
    onValue(userRef, (snapshot) => {
        if (!snapshot.exists() || !marker.getMap()) return;
        
        const userData = snapshot.val();
        let badgeEmoji = '';
        let badgeColor = '#a855f7';
        
        if (userData.verified === 'yes') {
            badgeEmoji = '✓';
            badgeColor = '#1DA1F2';
        } else if (userData.verifiedprofesor === 'yes') {
            badgeEmoji = '🎓';
            badgeColor = '#4CAF50';
        } else if (userData.verifiedstudent === 'yes') {
            badgeEmoji = '📚';
            badgeColor = '#4ECDC4';
        } else if (userData.verifiedentidad === 'yes') {
            badgeEmoji = '🎭';
            badgeColor = '#95E1D3';
        } else if (userData.verifiedprofesorart === 'yes') {
            badgeEmoji = '🎨';
            badgeColor = '#F38181';
        } else if (userData.musicservice === 'yes') {
            badgeEmoji = '🎵';
            badgeColor = '#AA96DA';
        }
        
        if (badgeEmoji) {
            // Create badge overlay on marker icon
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = markerSize;
            canvas.width = size;
            canvas.height = size;
            
            // Get current marker icon and draw it
            const currentIcon = marker.getIcon();
            if (currentIcon && currentIcon.url) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    // Draw badge circle at bottom-right
                    const badgeX = size - badgeSize / 2 - 2;
                    const badgeY = size - badgeSize / 2 - 2;
                    ctx.fillStyle = badgeColor;
                    ctx.beginPath();
                    ctx.arc(badgeX, badgeY, badgeSize / 2, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Draw emoji/text in badge
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = `${badgeSize * 0.6}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(badgeEmoji, badgeX, badgeY);
                    
                    marker.setIcon({
                        url: canvas.toDataURL(),
                        scaledSize: new google.maps.Size(size, size),
                        anchor: new google.maps.Point(size / 2, size / 2)
                    });
                };
                img.src = currentIcon.url;
            }
        }
    }, { onlyOnce: true });
}

// Calculate service details
function calculateServiceDetails(userId, ubicacion, precio) {
    // Get current user location
    const currentUserLocRef = ref(db, `UserLocation/${currentUID}`);
    const selectedUserLocRef = ref(db, `UserLocation/${userId}`);
    
    onValue(currentUserLocRef, (currentSnap) => {
        if (!currentSnap.exists()) return;
        
        const currentLat = currentSnap.child('latitude').val();
        const currentLng = currentSnap.child('longitude').val();
        
        onValue(selectedUserLocRef, (selectedSnap) => {
            if (!selectedSnap.exists()) return;
            
            const selectedLat = selectedSnap.child('latitude').val();
            const selectedLng = selectedSnap.child('longitude').val();
            
            if (currentLat && currentLng && selectedLat && selectedLng) {
                const origin = `${currentLat},${currentLng}`;
                const destination = `${selectedLat},${selectedLng}`;
                
                fetchDrivingTime(origin, destination, userId);
            }
        }, { onlyOnce: true });
    }, { onlyOnce: true });
}

// Fetch driving time
function fetchDrivingTime(origin, destination, userId) {
    const directionsService = new google.maps.DirectionsService();
    
    directionsService.route({
        origin: origin,
        destination: destination,
        travelMode: google.maps.TravelMode.DRIVING
    }, (result, status) => {
        if (status === 'OK' && result.routes[0]) {
            const leg = result.routes[0].legs[0];
            const duration = leg.duration.text;
            
            // Update service info with time
            const serviceInfo = document.getElementById('serviceInfo');
            if (serviceInfo) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'service-info-item';
                timeDiv.innerHTML = `<strong>Tiempo Estimado:</strong> ${duration}`;
                serviceInfo.querySelector('.service-info').appendChild(timeDiv);
            }
        }
    });
}

// Seleccionar ubicación reciente
function seleccionarUbicacionReciente(direccion, latitud, longitud, nombreLugar) {
    const input = document.getElementById('direccionSerenata');
    if (input) {
        input.value = direccion;
        selectedDestinoLat = latitud;
        selectedDestinoLng = longitud;
        selectedNombreLugar = nombreLugar || direccion;
        
        obtenerUbicacionUsuarioDesdeFirebase((userLat, userLng) => {
            if (userLat != null && userLng != null) {
                const distance = google.maps.geometry.spherical.computeDistanceBetween(
                    new google.maps.LatLng(userLat, userLng),
                    new google.maps.LatLng(latitud, longitud)
                );
                const distanciaKm = distance / 1000.0;
                
                if (distanciaKm > 50) {
                    alert(`La ubicación seleccionada está a ${distanciaKm.toFixed(1)} km de tu ubicación actual`);
                }
            }
        });
    }
}

// Enviar cotizacion
async function enviarCotizacion(bandaUserId) {
    const direccion = document.getElementById('direccionSerenata').value.trim();
    const listaCanciones = document.getElementById('listaCanciones').value.trim();
    const planSerenata = document.getElementById('planSerenata').value.trim();
    const fecha = document.getElementById('fechaSerenata').value;
    const hora = document.getElementById('horaSerenata').value;
    const tipoPago = document.getElementById('tipoPago').value;
    
    if (!direccion || !listaCanciones || !planSerenata || !fecha || !hora) {
        alert('Por favor, completa todos los campos');
        return;
    }
    
    // Get group info (DE LA BANDA, no del cliente)
    const grupMusicRef = ref(db, `GrupMusicRegis/${bandaUserId}`);
    const grupSnap = await get(grupMusicRef);
    
    if (!grupSnap.exists()) {
        alert('La banda no tiene un grupo registrado');
        return;
    }
    
    let groupData = null;
    grupSnap.forEach((groupSnap) => {
        groupData = groupSnap.val();
    });

    // Cliente lat/lng (como obtenerUbicacionUsuarioDesdeFirebase)
    const clienteLocSnap = await get(ref(db, `UserLocation/${currentUID}`));
    const clienteLat = clienteLocSnap.exists() ? clienteLocSnap.child('latitude').val() : null;
    const clienteLng = clienteLocSnap.exists() ? clienteLocSnap.child('longitude').val() : null;

    // Calcular distancia inicial si hay coordenadas
    let distanciaInicialKm = null;
    if (clienteLat != null && clienteLng != null && selectedDestinoLat != null && selectedDestinoLng != null) {
        const distance = google.maps.geometry.spherical.computeDistanceBetween(
            new google.maps.LatLng(clienteLat, clienteLng),
            new google.maps.LatLng(selectedDestinoLat, selectedDestinoLng)
        );
        distanciaInicialKm = distance / 1000.0;
        console.log('Distancia inicial guardada:', distanciaInicialKm.toFixed(2), 'km');
    }
    
    // Guardar ubicación reciente si hay coordenadas
    if (selectedDestinoLat != null && selectedDestinoLng != null) {
        guardarUbicacionReciente(direccion, selectedDestinoLat, selectedDestinoLng, selectedNombreLugar);
    }
    
    // Estructura alineada a tu getStringObjectMap + extras del tracking
    const cotizacionData = {
        nameGrupo: groupData?.name || 'N/A',
        id: currentUID,              // cliente
        para: bandaUserId,           // banda
        hora: hora,
        fecha: fecha,
        precio: (groupData?.precio ?? '0').toString(),
        ubicacion: groupData?.ubicacion || 'N/A',
        direccion: direccion,
        lista: listaCanciones,
        plan: planSerenata,
        aceptada: '',
        confirmada: '',
        finalizada: '',
        canceladauser: '',
        canceladabanda: '',
        adelanto: '',
        pagocon: tipoPago,
        rate: '0',
        status: 'pending',
        destinoLat: selectedDestinoLat ?? null,
        destinoLng: selectedDestinoLng ?? null,
        clienteLat: clienteLat ?? null,
        clienteLng: clienteLng ?? null,
        distanciaInicialKm: distanciaInicialKm,
        mariachiLat: null,
        mariachiLng: null,
        tiempoEstimadoLlegada: null,
        tiempoEstimadoTexto: '',
        timestampInicioRuta: null,
        timestampLlegada: null,
        timestampInicioServicio: null,
        timestampFinServicio: null,
        distanciaRecorridaKm: null,
        tiempoTotalServicio: null,
        calificacion: null,
        comentarioCalificacion: ''
    };
    
    const cotizacionRef = ref(db, `CotizacionBanda/${bandaUserId}`);
    const newKey = push(cotizacionRef).key;
    
    if (!newKey) {
        alert('Error al generar ID de cotización');
        return;
    }
    
    // Guardar en ambas rutas (como Android)
    await set(ref(db, `CotizacionBanda/${bandaUserId}/${newKey}`), cotizacionData);
    await set(ref(db, `CotizacionComprador/${currentUID}/${newKey}`), cotizacionData);
    
    // Enviar notificación (simplificado - en web no tenemos FCM completo)
    const tokenRef = ref(db, `Tokens/${bandaUserId}/token`);
    onValue(tokenRef, (tokenSnap) => {
        const token = tokenSnap.val();
        if (token) {
            console.log('Notificación enviada a banda:', bandaUserId);
            // En web, las notificaciones push requieren Service Worker
            // Por ahora solo logueamos
        }
    }, { onlyOnce: true });
    
    // Mostrar UI de cotizaciones
    const seeSerenatas = document.getElementById('seeSerenatas');
    const mySerenatas = document.getElementById('mySerenatas');
    if (seeSerenatas) seeSerenatas.classList.add('show');
    if (mySerenatas) mySerenatas.classList.remove('show');
    
    alert('Cotización enviada exitosamente');
    document.getElementById('cotizacionModal').classList.remove('show');
}

// Load filtered users and places (como Android - loadFilteredUsersAndPlaces)
function loadFilteredUsersAndPlaces(acceptedValues) {
    if (!acceptedValues || acceptedValues.length === 0) {
        showAllUsersWithToast();
        return;
    }
    
    showLoading();
    const usersRef = ref(db, 'Users');
    const locationRef = ref(db, 'UserLocation');
    const rvBanda = document.getElementById('rvBanda');
    const topBands = document.getElementById('topBands');
    
    onValue(usersRef, (usersSnap) => {
        clearMarkers();
        boundsBuilder = new google.maps.LatLngBounds();
        const matchingUserIds = [currentUID];
        
        usersSnap.forEach((userSnap) => {
            const userId = userSnap.key;
            if (userId === currentUID) return;
            
            const generoMusic = userSnap.child('generoMusic').val();
            if (!generoMusic) return;
            
            const genres = generoMusic.split(/[/.\-_(),;:\[\]{}|]/);
            for (const genre of genres) {
                if (acceptedValues.includes(genre.trim())) {
                    matchingUserIds.push(userId);
                    break;
                }
            }
        });
        
        onValue(locationRef, (locSnap) => {
            hideLoading();
            locSnap.forEach((locChild) => {
                const userId = locChild.key;
                if (matchingUserIds.includes(userId)) {
                    const lat = locChild.child('latitude').val();
                    const lng = locChild.child('longitude').val();
                    if (lat && lng) {
                        const location = { lat, lng };
                        boundsBuilder.extend(location);
                        loadUserDataAndAddMarker(location, userId);
                    }
                }
            });
            
            if (boundsBuilder.getNorthEast()) {
                map.fitBounds(boundsBuilder);
            }
        }, { onlyOnce: true });
        
        // Cargar entidades (getEntidades)
        getEntidades();
    }, { onlyOnce: true });
}

// Get entidades (como Android - carga mariachis verificados en rvBanda/topBands)
function getEntidades() {
    const topBands = document.getElementById('topBands');
    const rvBanda = document.getElementById('rvBanda');
    const progressBar = document.getElementById('progressBarContainer');
    const seeAgain = document.getElementById('seeAgain');
    
    if (!topBands || !rvBanda) return;
    
    rvBanda.innerHTML = '';
    topBands.classList.remove('show');
    if (progressBar) progressBar.classList.add('show');
    if (seeAgain) seeAgain.classList.remove('show');
    
    // Cargar mariachis (loadMariachis)
    loadMariachis();
    
    // Cargar usuarios verificados con generoMusic = mariachi
    const usersRef = ref(db, 'Users');
    onValue(usersRef, (usersSnap) => {
        if (progressBar) progressBar.classList.remove('show');
        topBands.classList.add('show');
        
        const userListS = [];
        
        usersSnap.forEach((userSnap) => {
            if (!userSnap.hasChild('name') || !userSnap.hasChild('verified') || 
                !userSnap.hasChild('generoMusic') || !userSnap.hasChild('photo')) {
                return;
            }
            
            const verified = userSnap.child('verified').val();
            const generoMusic = userSnap.child('generoMusic').val();
            const photo = userSnap.child('photo').val();
            
            if (verified && generoMusic && photo && photo.trim() !== '') {
                const generoLower = generoMusic.toLowerCase().trim();
                if (generoLower === 'm.mariachi' || generoLower === 'mariachi') {
                    const userId = userSnap.key;
                    if (userId !== currentUID) {
                        const userData = userSnap.val();
                        userListS.push({ id: userId, ...userData });
                    }
                }
            }
        });
        
        // Render entidades (AdapterEntidades web)
        userListS.forEach(user => {
            renderEntidadCard(user, rvBanda);
        });
    }, { onlyOnce: true });
}

// Render entidad card (AdapterEntidades web)
function renderEntidadCard(user, container) {
    const defaultAvatar = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
    const photoUrl = (user.photo && user.photo.trim()) ? user.photo : defaultAvatar;
    
    const card = document.createElement('div');
    card.className = 'entidad-card';
    card.innerHTML = `
        <img src="${photoUrl}" alt="${user.name || 'Usuario'}" class="entidad-card-photo" 
             onerror="this.src='${defaultAvatar}'">
        <div class="entidad-card-name">${user.name || 'Usuario'}</div>
    `;
    
    card.onclick = () => {
        // Centrar en mapa y mostrar bottom sheet
        const locRef = ref(db, `UserLocation/${user.id}`);
        onValue(locRef, (locSnap) => {
            if (locSnap.exists()) {
                const lat = locSnap.child('latitude').val();
                const lng = locSnap.child('longitude').val();
                if (lat && lng && map) {
                    map.panTo({ lat, lng });
                    map.setZoom(15);
                }
            }
        }, { onlyOnce: true });
        
        showBottomSheet({
            photoUrl,
            username: user.username || 'username',
            name: user.name || 'Usuario',
            instrument: user.instrument || '',
            generoMusic: user.generoMusic || '',
            status: user.status || '',
            userId: user.id
        });
    };
    
    container.appendChild(card);
}

// Load places from Firebase
function loadPlacesFromFirebase(type) {
    showLoading();
    const placesRef = ref(db, 'Places');
    
    onValue(placesRef, (snapshot) => {
        hideLoading();
        clearMarkers();
        boundsBuilder = new google.maps.LatLngBounds();
        
        if (!snapshot.exists()) {
            alert(`No hay ${type} registrados`);
            return;
        }
        
        snapshot.forEach((placeSnap) => {
            const placeData = placeSnap.val();
            if (placeData.type === type) {
                const location = { lat: placeData.latitude, lng: placeData.longitude };
                boundsBuilder.extend(location);
                
                const marker = new google.maps.Marker({
                    position: location,
                    map: map,
                    title: placeData.name || type,
                    icon: {
                        url: placeData.photoUrl || 'assets/point.png',
                        scaledSize: new google.maps.Size(40, 40)
                    }
                });
                
                markers.push(marker);
            }
        });
        
        if (boundsBuilder.getNorthEast()) {
            map.fitBounds(boundsBuilder);
        }
    }, { onlyOnce: true });
}

// Search location
document.getElementById('searchBtn').addEventListener('click', () => {
    const searchText = document.getElementById('searchInput').value.trim();
    if (searchText) {
        searchLocation(searchText);
    }
});

function searchLocation(locationName) {
    const geocoder = new google.maps.Geocoder();
    
    geocoder.geocode({ address: locationName }, (results, status) => {
        if (status === 'OK' && results[0]) {
            const location = results[0].geometry.location;
            map.setCenter(location);
            map.setZoom(15);
            
            // Add marker
            const marker = new google.maps.Marker({
                position: location,
                map: map,
                title: locationName
            });
            
            // Load users near this location
            loadUserLocations();
        } else {
            alert('Ubicación no encontrada. Intenta con otro nombre.');
        }
    });
}

// Clear markers
function clearMarkers() {
    markers.forEach(marker => marker.setMap(null));
    markers = [];
    if (currentRoutePolyline) {
        currentRoutePolyline.setMap(null);
        currentRoutePolyline = null;
    }
}

// Cargar cotizaciones (como Android - serviciosBanda pendientes, rvSPendientes confirmadas)
function cargarCotizaciones() {
    if (!currentUID) return;
    
    const cotizacionRef = ref(db, `CotizacionBanda/${currentUID}`);
    const serviciosBanda = document.getElementById('serviciosBanda');
    const serviciosBandaList = document.getElementById('serviciosBandaList');
    const rvSPendientes = document.getElementById('rvSPendientes');
    const rvSPendientesList = document.getElementById('rvSPendientesList');
    const seePendientes = document.getElementById('seePendientes');
    
    onValue(cotizacionRef, (snapshot) => {
        if (!snapshot.exists()) {
            serviciosBanda.classList.remove('show');
            rvSPendientes.classList.remove('show');
            if (seePendientes) seePendientes.style.display = 'none';
            return;
        }
        
        const pendientesList = [];
        const confirmadasList = [];
        
        snapshot.forEach((cotSnap) => {
            const cotData = cotSnap.val();
            const cotKey = cotSnap.key;
            
            // Fix idCotizante si falta (como Android)
            if (!cotData.idCotizante || cotData.idCotizante === '') {
                const idCliente = cotData.id;
                if (idCliente) cotData.idCotizante = idCliente;
            }
            
            // Fix destinoLat/destinoLng si faltan
            if ((!cotData.destinoLat || !cotData.destinoLng) && cotSnap.hasChild('destinoLat')) {
                const destinoLat = cotSnap.child('destinoLat').val();
                const destinoLng = cotSnap.child('destinoLng').val();
                if (destinoLat != null && destinoLng != null) {
                    cotData.destinoLat = destinoLat;
                    cotData.destinoLng = destinoLng;
                }
            }
            
            // Pendientes: aceptada vacía/null o "cancel"
            if (!cotData.aceptada || cotData.aceptada === '' || cotData.aceptada.toLowerCase() === 'cancel') {
                pendientesList.push({ ...cotData, key: cotKey });
            }
            
            // Confirmadas: confirmada === "yes"
            if (cotData.confirmada === 'yes') {
                confirmadasList.push({ ...cotData, key: cotKey });
            }
        });
        
        // Render pendientes (serviciosBanda)
        if (pendientesList.length > 0) {
            serviciosBandaList.innerHTML = '';
            pendientesList.forEach(cot => {
                renderCotizacionCard(cot, serviciosBandaList, 'pendiente');
            });
            serviciosBanda.classList.add('show');
            if (seePendientes) seePendientes.style.display = 'none';
        } else {
            serviciosBanda.classList.remove('show');
        }
        
        // Render confirmadas (rvSPendientes) con toggle
        if (confirmadasList.length > 0) {
            if (seePendientes) {
                seePendientes.style.display = 'block';
                seePendientes.onclick = () => {
                    if (rvSPendientes.classList.contains('show')) {
                        rvSPendientes.classList.remove('show');
                    } else {
                        rvSPendientesList.innerHTML = '';
                        confirmadasList.forEach(cot => {
                            renderCotizacionCard(cot, rvSPendientesList, 'confirmada');
                        });
                        rvSPendientes.classList.add('show');
                    }
                };
            }
        } else {
            rvSPendientes.classList.remove('show');
            if (seePendientes) seePendientes.style.display = 'none';
        }
    });
}

// Render cotizacion card (AdapterCotizacionBanda web)
async function renderCotizacionCard(cotData, container, type) {
    const card = document.createElement('div');
    card.className = 'cotizacion-card';
    
    // Get cliente photo
    const clienteId = cotData.idCotizante || cotData.id;
    let clientePhoto = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
    let clienteName = 'Cliente';
    
    if (clienteId) {
        const clienteSnap = await get(ref(db, `Users/${clienteId}`));
        if (clienteSnap.exists()) {
            const cliente = clienteSnap.val();
            clientePhoto = (cliente.photo && cliente.photo.trim()) ? cliente.photo : clientePhoto;
            clienteName = cliente.name || cliente.username || 'Cliente';
        }
    }
    
    card.innerHTML = `
        <div class="cotizacion-card-header">
            <img src="${clientePhoto}" alt="${clienteName}" class="cotizacion-card-photo" 
                 onerror="this.src='https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media'">
            <div class="cotizacion-card-info">
                <div class="cotizacion-card-name">${cotData.nameGrupo || 'Grupo'}</div>
                <div class="cotizacion-card-precio">${getCurrencyPrefix(cotData.ubicacion)}${cotData.precio || '0'}</div>
            </div>
        </div>
        <div class="cotizacion-card-direccion">${cotData.direccion || 'Sin dirección'}</div>
    `;
    
    card.onclick = () => {
        // Abrir detalles o centrar en mapa
        if (cotData.destinoLat && cotData.destinoLng && map) {
            map.panTo({ lat: cotData.destinoLat, lng: cotData.destinoLng });
            map.setZoom(15);
        }
    };
    
    container.appendChild(card);
}

// Leer serenata comprador (como Android - mySerenatas/seeSerenatas)
let cotizacionCompradorListener = null;
let activeTrackingListeners = new Map();

function leerSerenataComprador() {
    if (!currentUID) return;
    
    // Limpiar listener anterior si existe
    if (cotizacionCompradorListener) {
        const oldRef = ref(db, `CotizacionComprador/${currentUID}`);
        oldRef.off('value', cotizacionCompradorListener);
    }
    
    const cotizacionCompradorRef = ref(db, `CotizacionComprador/${currentUID}`);
    const mySerenatas = document.getElementById('mySerenatas');
    const seeSerenatas = document.getElementById('seeSerenatas');
    const mySerenatasList = document.getElementById('mySerenatasList');
    
    cotizacionCompradorListener = onValue(cotizacionCompradorRef, (snapshot) => {
        if (!snapshot.exists()) {
            mySerenatas.classList.remove('show');
            seeSerenatas.classList.remove('show');
            return;
        }
        
        seeSerenatas.classList.add('show');
        let isSelected = false;
        
        seeSerenatas.onclick = () => {
            isSelected = !isSelected;
            const topBands = document.getElementById('topBands');
            
            if (isSelected) {
                mySerenatas.classList.add('show');
                if (topBands) topBands.classList.remove('show');
                renderMySerenatas(snapshot, mySerenatasList);
            } else {
                mySerenatas.classList.remove('show');
                if (topBands) topBands.classList.add('show');
            }
        };
    });
}

// Render mis serenatas (como Android - leerSerenataComprador completo)
function renderMySerenatas(snapshot, container) {
    container.innerHTML = '';
    
    snapshot.forEach((cotSnap) => {
        const cotData = cotSnap.val();
        const cotKey = cotSnap.key;
        const nameGrupo = cotData.nameGrupo || 'Desconocido';
        const precio = cotData.precio || '0';
        const ubicacion = cotData.ubicacion || 'Sin ubicación';
        const direccion = cotData.direccion || cotData.plan || '';
        const bandaId = cotData.id || '';
        const aprovacion = cotData.aceptada || '';
        const txtTimeC = cotData.hora || '00:00 pm?';
        const fecha = cotData.fecha || '00/00/0000?';
        const status = cotData.status || '';
        const destinoLat = cotData.destinoLat;
        const destinoLng = cotData.destinoLng;
        const mariachiLat = cotData.mariachiLat;
        const mariachiLng = cotData.mariachiLng;
        const tiempoEstimadoTexto = cotData.tiempoEstimadoTexto || '';
        
        const serenataItem = document.createElement('div');
        serenataItem.className = 'serenata-item';
        
        // Determinar estado y texto del botón
        let estadoTexto = 'Pendiente';
        let estadoClass = 'pending';
        let btnTexto = 'Esperando respuesta';
        
        if (status && status !== '') {
            switch (status) {
                case 'pending':
                    estadoTexto = 'Pendiente';
                    estadoClass = 'pending';
                    btnTexto = 'Esperando respuesta';
                    break;
                case 'accepted':
                    estadoTexto = 'Aceptada';
                    estadoClass = 'accepted';
                    btnTexto = 'Ver';
                    break;
                case 'in_progress':
                    estadoTexto = 'En camino' + (tiempoEstimadoTexto ? ' - ' + tiempoEstimadoTexto : '');
                    estadoClass = 'in_progress';
                    btnTexto = 'Ver ubicación';
                    // Iniciar tracking si no está activo
                    if (!activeTrackingListeners.has(cotKey)) {
                        iniciarTrackingCliente(bandaId, cotKey, mariachiLat, mariachiLng, 
                                             destinoLat, destinoLng, direccion, ubicacion, nameGrupo);
                    }
                    break;
                case 'arrived':
                    estadoTexto = 'El mariachi llegó. Confirma su llegada';
                    estadoClass = 'arrived';
                    btnTexto = 'Confirmar llegada';
                    break;
                case 'service_started':
                    estadoTexto = 'Servicio en curso';
                    estadoClass = 'in_progress';
                    btnTexto = 'Ver servicio';
                    break;
                case 'completed':
                    estadoTexto = 'Completado';
                    estadoClass = 'completed';
                    btnTexto = 'Ver detalles';
                    detenerTrackingCliente(cotKey);
                    break;
                case 'cancelled':
                    estadoTexto = 'Cancelado';
                    estadoClass = 'cancelled';
                    btnTexto = 'Ver detalles';
                    detenerTrackingCliente(cotKey);
                    break;
                default:
                    if (aprovacion === 'yes') {
                        estadoTexto = 'Aprobada';
                        estadoClass = 'accepted';
                        btnTexto = 'Ver';
                    } else if (aprovacion === 'no') {
                        estadoTexto = 'Declinada';
                        estadoClass = 'cancelled';
                        btnTexto = 'No disponible';
                    }
            }
        } else {
            if (aprovacion === 'yes') {
                estadoTexto = 'Aprobada';
                estadoClass = 'accepted';
                btnTexto = 'Ver';
            } else if (aprovacion === 'no') {
                estadoTexto = 'Declinada';
                estadoClass = 'cancelled';
                btnTexto = 'No disponible';
            }
        }
        
        // Get photos
        const defaultAvatar = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
        
        serenataItem.innerHTML = `
            <div class="serenata-item-header">
                <img id="myPic_${cotKey}" src="${defaultAvatar}" alt="Yo" class="serenata-item-photo">
                <img id="youPic_${cotKey}" src="${defaultAvatar}" alt="Banda" class="serenata-item-photo">
            </div>
            <div class="serenata-item-info">
                <div class="serenata-item-name">${nameGrupo}</div>
                <div class="serenata-item-precio">${getCurrencyPrefix(ubicacion)}${precio}</div>
                <div class="serenata-item-details">${direccion}</div>
                <div class="serenata-item-details">${fecha} - ${txtTimeC}</div>
                <div class="serenata-item-estado ${estadoClass}">${estadoTexto}</div>
                <button class="cotizar-btn" id="btnView_${cotKey}" style="margin-top:10px;">${btnTexto}</button>
            </div>
        `;
        
        container.appendChild(serenataItem);
        
        // Load photos
        loadUserPhoto(currentUID, `myPic_${cotKey}`);
        if (bandaId) loadUserPhoto(bandaId, `youPic_${cotKey}`);
        
        // Button click handler
        const btnView = document.getElementById(`btnView_${cotKey}`);
        if (btnView) {
            btnView.onclick = () => {
                mySerenatas.classList.remove('show');
                
                if (bandaId && (status === 'in_progress' || status === 'arrived' || status === 'service_started')) {
                    // Mostrar ruta y tracking
                    mostrarRutaYCotizacion(cotData, cotKey, bandaId);
                } else if (bandaId && status === 'arrived') {
                    // Confirmar llegada
                    confirmarServicio(bandaId, cotKey, currentUID);
                } else {
                    // Ver detalles básicos
                    mostrarDetallesCotizacion(cotData);
                }
            };
        }
    });
}

// Load user photo helper
function loadUserPhoto(userId, imgId) {
    const userRef = ref(db, `Users/${userId}/photo`);
    onValue(userRef, (snap) => {
        const img = document.getElementById(imgId);
        if (img) {
            const photoUrl = snap.val();
            const defaultAvatar = 'https://firebasestorage.googleapis.com/v0/b/proviweb-d8764.appspot.com/o/FIAMImages%2Fnewuser.png?alt=media';
            img.src = (photoUrl && photoUrl.trim()) ? photoUrl : defaultAvatar;
            img.onerror = () => { img.src = defaultAvatar; };
        }
    }, { onlyOnce: true });
}

// Mostrar ruta y cotización (equivalente a drawRoute en Android)
function mostrarRutaYCotizacion(cotData, cotizacionId, bandaId) {
    const clienteLat = cotData.clienteLat;
    const clienteLng = cotData.clienteLng;
    const destinoLat = cotData.destinoLat;
    const destinoLng = cotData.destinoLng;
    const mariachiLat = cotData.mariachiLat;
    const mariachiLng = cotData.mariachiLng;
    const direccion = cotData.direccion || '';
    const ubicacion = cotData.ubicacion || '';
    
    // Si hay mariachiLat/Lng, usar esos; sino obtener de UserLocation
    if (mariachiLat != null && mariachiLng != null) {
        const bandLatLng = { lat: mariachiLat, lng: mariachiLng };
        if (map) {
            if (bandMarker) bandMarker.setMap(null);
            bandMarker = new google.maps.Marker({
                position: bandLatLng,
                map: map,
                title: 'Ubicación del Grupo',
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                        <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                            <rect width="40" height="40" fill="#4CAF50" rx="5"/>
                            <text x="20" y="25" font-size="20" text-anchor="middle">🚐</text>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(40, 40)
                }
            });
        }
        
        const origin = `${mariachiLat},${mariachiLng}`;
        const fullDestination = direccion + (ubicacion ? ', ' + ubicacion : '');
        if (direccion) {
            drawRoute(origin, fullDestination, currentUID, bandaId, cotizacionId, 
                     cotData.nameGrupo, cotData.precio, direccion, cotData.hora);
        }
    } else {
        // Obtener de UserLocation en tiempo real
        const bandLocationRef = ref(db, `UserLocation/${bandaId}`);
        const bandLocationListener = onValue(bandLocationRef, (bandSnap) => {
            if (bandSnap.exists()) {
                const lat = bandSnap.child('latitude').val();
                const lng = bandSnap.child('longitude').val();
                
                if (lat != null && lng != null) {
                    const bandLatLng = { lat, lng };
                    if (map) {
                        if (bandMarker) bandMarker.setMap(null);
                        bandMarker = new google.maps.Marker({
                            position: bandLatLng,
                            map: map,
                            title: 'Ubicación del Grupo',
                            icon: {
                                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                                    <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                                        <rect width="40" height="40" fill="#4CAF50" rx="5"/>
                                        <text x="20" y="25" font-size="20" text-anchor="middle">🚐</text>
                                    </svg>
                                `),
                                scaledSize: new google.maps.Size(40, 40)
                            }
                        });
                    }
                    
                    const origin = `${lat},${lng}`;
                    const fullDestination = direccion + (ubicacion ? ', ' + ubicacion : '');
                    if (direccion) {
                        drawRoute(origin, fullDestination, currentUID, bandaId, cotizacionId, 
                                 cotData.nameGrupo, cotData.precio, direccion, cotData.hora);
                    }
                }
            }
        });
        
        // Guardar listener para limpiarlo después
        activeTrackingListeners.set('band_' + cotizacionId, bandLocationListener);
    }
}
