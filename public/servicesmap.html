            <button onclick="this.parentElement.parentElement.remove()" style="width:100%;padding:10px;background:linear-gradient(135deg, #a855f7 0%, #007BFF 100%);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;">Cerrar</button>
        </div>
    `;
    document.body.appendChild(modal);
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

// Show route option
function showRouteOption(cotData, cotizacionId, bandaId) {
    const routeInfo = document.getElementById('routeInfo');
    routeInfo.classList.add('show');
    
    // Update route info display
    routeInfo.innerHTML = `
        <div class="route-title">${cotData.nameGrupo || 'Servicio'}</div>
        <div class="route-item">Precio: ${getCurrencyPrefix(cotData.ubicacion)}${cotData.precio || '0'}</div>
        <div class="route-item">Dirección: ${cotData.direccion || 'N/A'}</div>
        <div class="route-item" id="routeTime">Tiempo: Calculando...</div>
        <div class="route-item" id="routeDistance">Distancia: -</div>
        <button class="confirm-btn" id="confirmRoute">Confirmar</button>
        <button class="cancel-btn" id="cancelRoute">Cancelar</button>
    `;
    
    // Load band location and draw route
    bandLocationRef = ref(db, `UserLocation/${bandaId}`);
    
    onValue(bandLocationRef, (bandSnap) => {
        if (!bandSnap.exists()) {
            alert('La banda no tiene ubicación registrada');
            return;
        }
        
        const lat = bandSnap.child('latitude').val();
        const lng = bandSnap.child('longitude').val();
        
        if (lat && lng) {
            const bandLocation = { lat, lng };
            
            // Get current user location
            const currentUserLocRef = ref(db, `UserLocation/${currentUID}`);
            onValue(currentUserLocRef, (currentSnap) => {
                if (!currentSnap.exists()) {
                    // Use geolocation as fallback
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((position) => {
                            const currentLocation = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            const destination = cotData.direccion || '';
                            if (destination) {
                                drawRoute(currentLocation, destination, bandaId, cotizacionId, cotData);
                            }
                        });
                    }
                    return;
                }
                
                const currentLat = currentSnap.child('latitude').val();
                const currentLng = currentSnap.child('longitude').val();
                
                if (currentLat && currentLng) {
                    const currentLocation = { lat: currentLat, lng: currentLng };
                    const destination = cotData.direccion || '';
                    
                    if (destination) {
                        drawRoute(bandLocation, destination, bandaId, cotizacionId, cotData);
                    } else {
                        alert('No hay dirección de destino');
                    }
                }
            }, { onlyOnce: true });
        }
    }, { onlyOnce: true });
}

// Draw route
function drawRoute(origin, destination, bandaId, cotizacionId, cotData) {
    if (!map) return;
    
    const directionsService = new google.maps.DirectionsService();
    const directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: true,
        polylineOptions: {
            strokeColor: '#007BFF',
            strokeWeight: 5
        }
    });
    
    directionsRenderer.setMap(map);
    
    // Convert origin object to string if needed
    const originStr = typeof origin === 'object' ? `${origin.lat},${origin.lng}` : origin;
    
    directionsService.route({
        origin: originStr,
        destination: destination,
        travelMode: google.maps.TravelMode.DRIVING
    }, (result, status) => {
        if (status === 'OK') {
            directionsRenderer.setDirections(result);
            currentRoutePolyline = directionsRenderer;
            
            // Get route info
            const route = result.routes[0];
            const leg = route.legs[0];
            const duration = leg.duration.text;
            const distance = leg.distance.text;
            
            document.getElementById('routeTime').textContent = `Tiempo: ${duration}`;
            document.getElementById('routeDistance').textContent = `Distancia: ${distance}`;
            
            // Add markers
            if (startMarker) startMarker.setMap(null);
            if (destinationMarker) destinationMarker.setMap(null);
            
            startMarker = new google.maps.Marker({
                position: leg.start_location,
                map: map,
                title: 'Van',
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                        <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                            <rect width="40" height="40" fill="#4CAF50" rx="5"/>
                            <text x="20" y="25" font-size="20" text-anchor="middle">🚐</text>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(40, 40)
                }
            });
            
            destinationMarker = new google.maps.Marker({
                position: leg.end_location,
                map: map,
                title: 'Destino',
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                        <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="18" fill="#FF6B6B" stroke="white" stroke-width="2"/>
                            <text x="20" y="25" font-size="20" text-anchor="middle">📍</text>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(40, 40)
                }
            });
            
            // Fit bounds to show entire route
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(leg.start_location);
            bounds.extend(leg.end_location);
            map.fitBounds(bounds);
            
            // Update route info
            document.getElementById('confirmRoute').onclick = () => {
                confirmarServicio(bandaId, cotizacionId);
            };
            
            document.getElementById('cancelRoute').onclick = () => {
                cancelarServicio(bandaId, cotizacionId);
            };
            
            // Track band location in real time
            trackBandLocation(bandaId);
        } else {
            alert('No se pudo calcular la ruta: ' + status);
        }
    });
}

// Track band location
function trackBandLocation(bandaId) {
    const vanLocationRef = ref(db, `UserLocation/${bandaId}`);
    
    // Remove old listener if exists
    if (ubicacionListener) {
        // Note: In Firebase v9+, we need to store the unsubscribe function
        // For now, we'll just overwrite it
    }
    
    ubicacionListener = onValue(vanLocationRef, (snap) => {
        if (!snap.exists() || !startMarker) return;
        
        const lat = snap.child('latitude').val();
        const lng = snap.child('longitude').val();
        
        if (lat && lng) {
            const newPosition = { lat, lng };
            startMarker.setPosition(newPosition);
            
            // Smoothly center map on van
            map.panTo(newPosition);
        }
    });
}

// Iniciar tracking cliente (como Android - tracking en tiempo real con actualización de ruta)
function iniciarTrackingCliente(bandaId, cotizacionId, mariachiLatInicial, mariachiLngInicial, 
                                destinoLat, destinoLng, direccion, ubicacion, nameGrupo) {
    if (!bandaId || !cotizacionId) return;
    
    const listenerKey = 'tracking_' + cotizacionId;
    
    // Limpiar listener anterior si existe
    if (activeTrackingListeners.has(listenerKey)) {
        const oldListener = activeTrackingListeners.get(listenerKey);
        const oldRef = ref(db, `CotizacionComprador/${currentUID}/${cotizacionId}`);
        oldRef.off('value', oldListener);
        activeTrackingListeners.delete(listenerKey);
    }
    
    const cotizacionRef = ref(db, `CotizacionComprador/${currentUID}/${cotizacionId}`);
    let lastMariachiPosition = null;
    let lastRouteUpdateTime = 0;
    const ROUTE_UPDATE_INTERVAL = 30000; // 30 segundos
    
    const trackingListener = onValue(cotizacionRef, (snapshot) => {
        if (!snapshot.exists()) return;
        
        const status = snapshot.child('status').val();
        const mariachiLat = snapshot.child('mariachiLat').val();
        const mariachiLng = snapshot.child('mariachiLng').val();
        const tiempoEstimadoTexto = snapshot.child('tiempoEstimadoTexto').val() || '';
        
        if (status === 'in_progress' && mariachiLat != null && mariachiLng != null) {
            const mariachiLatLng = { lat: mariachiLat, lng: mariachiLng };
            
            if (map) {
                if (!bandMarker) {
                    bandMarker = new google.maps.Marker({
                        position: mariachiLatLng,
                        map: map,
                        title: 'Mariachi en camino' + (tiempoEstimadoTexto ? ' - ' + tiempoEstimadoTexto : ''),
                        icon: {
                            url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                                <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="40" height="40" fill="#4CAF50" rx="5"/>
                                    <text x="20" y="25" font-size="20" text-anchor="middle">🚐</text>
                                </svg>
                            `),
                            scaledSize: new google.maps.Size(40, 40)
                        }
                    });
                } else {
                    bandMarker.setPosition(mariachiLatLng);
                    bandMarker.setTitle('Mariachi en camino' + (tiempoEstimadoTexto ? ' - ' + tiempoEstimadoTexto : ''));
                }
                
                // Centrar mapa en mariachi
                map.panTo(mariachiLatLng);
                
                // Actualizar ruta si es necesario
                if (destinoLat != null && destinoLng != null) {
                    const currentTime = Date.now();
                    let shouldUpdateRoute = false;
                    
                    if (lastMariachiPosition == null) {
                        shouldUpdateRoute = true;
                    } else {
                        const distance = google.maps.geometry.spherical.computeDistanceBetween(
                            new google.maps.LatLng(lastMariachiPosition.lat, lastMariachiPosition.lng),
                            new google.maps.LatLng(mariachiLat, mariachiLng)
                        );
                        
                        if ((currentTime - lastRouteUpdateTime) > ROUTE_UPDATE_INTERVAL || distance > 100) {
                            shouldUpdateRoute = true;
                        }
                    }
                    
                    if (shouldUpdateRoute) {
                        const origin = `${mariachiLat},${mariachiLng}`;
                        const destination = `${destinoLat},${destinoLng}`;
                        
                        if (!currentRoutePolyline) {
                            drawRoute(origin, destination, currentUID, bandaId, cotizacionId, nameGrupo, '', direccion, '');
                        } else {
                            currentRoutePolyline.setMap(null);
                            currentRoutePolyline = null;
                            if (startMarker) {
                                startMarker.setMap(null);
                                startMarker = null;
                            }
                            drawRoute(origin, destination, currentUID, bandaId, cotizacionId, nameGrupo, '', direccion, '');
                        }
                        
                        lastMariachiPosition = mariachiLatLng;
                        lastRouteUpdateTime = currentTime;
                    } else {
                        // Solo actualizar posición del marcador
                        if (startMarker) {
                            startMarker.setPosition(mariachiLatLng);
                        } else if (map) {
                            startMarker = new google.maps.Marker({
                                position: mariachiLatLng,
                                map: map,
                                title: 'Van',
                                icon: {
                                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                                        <svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                                            <rect width="40" height="40" fill="#4CAF50" rx="5"/>
                                            <text x="20" y="25" font-size="20" text-anchor="middle">🚐</text>
                                        </svg>
                                    `),
                                    scaledSize: new google.maps.Size(40, 40)
                                }
                            });
                        }
                    }
                }
            }
        } else if (status === 'arrived') {
            if (bandMarker && mariachiLat != null && mariachiLng != null) {
                bandMarker.setPosition({ lat: mariachiLat, lng: mariachiLng });
                bandMarker.setTitle('Mariachi llegó al destino');
            }
        } else if (status === 'service_started') {
            if (bandMarker) bandMarker.setTitle('Servicio en curso');
        } else if (status === 'completed') {
            if (bandMarker) bandMarker.setTitle('Servicio completado');
        }
    });
    
    activeTrackingListeners.set(listenerKey, trackingListener);
}

// Detener tracking cliente
function detenerTrackingCliente(cotizacionId) {
    if (!cotizacionId) return;
    
    const listenerKey = 'tracking_' + cotizacionId;
    
    if (activeTrackingListeners.has(listenerKey)) {
        const listener = activeTrackingListeners.get(listenerKey);
        const cotizacionRef = ref(db, `CotizacionComprador/${currentUID}/${cotizacionId}`);
        cotizacionRef.off('value', listener);
        activeTrackingListeners.delete(listenerKey);
    }
}

// Ubicaciones recientes (localStorage + Firebase)
function guardarUbicacionReciente(direccion, latitud, longitud, nombreLugar) {
    if (!direccion || !direccion.trim() || latitud == null || longitud == null) return;
    if (!currentUID) return;
    
    try {
        const key = 'ubicaciones_' + currentUID;
        let ubicacionesJson = localStorage.getItem(key) || '[]';
        let ubicacionesArray = JSON.parse(ubicacionesJson);
        
        // Remover duplicados
        ubicacionesArray = ubicacionesArray.filter(u => u.direccion !== direccion);
        
        // Agregar al inicio
        const nuevaUbicacion = {
            direccion: direccion,
            latitud: latitud,
            longitud: longitud,
            nombreLugar: nombreLugar || '',
            timestamp: Date.now()
        };
        ubicacionesArray.unshift(nuevaUbicacion);
        
        // Limitar a 5
        while (ubicacionesArray.length > 5) {
            ubicacionesArray.pop();
        }
        
        localStorage.setItem(key, JSON.stringify(ubicacionesArray));
        
        // Guardar también en Firebase
        const ubicacionesRef = ref(db, `UserLocationsHistory/${currentUID}`);
        push(ubicacionesRef, nuevaUbicacion);
        
    } catch (e) {
        console.error('Error guardando ubicación reciente:', e);
    }
}

function cargarUbicacionesRecientes() {
    if (!currentUID) return [];
    
    try {
        const key = 'ubicaciones_' + currentUID;
        const ubicacionesJson = localStorage.getItem(key) || '[]';
        return JSON.parse(ubicacionesJson);
    } catch (e) {
        console.error('Error cargando ubicaciones recientes:', e);
        return [];
    }
}

// Obtener ubicación usuario desde Firebase (callback)
function obtenerUbicacionUsuarioDesdeFirebase(callback) {
    if (!currentUID) {
        callback(null, null);
        return;
    }
    
    const userLocationRef = ref(db, `UserLocation/${currentUID}`);
    onValue(userLocationRef, (snapshot) => {
        if (snapshot.exists()) {
            const lat = snapshot.child('latitude').val();
            const lng = snapshot.child('longitude').val();
            callback(lat, lng);
        } else {
            callback(null, null);
        }
    }, { onlyOnce: true });
}

// Confirmar servicio
async function confirmarServicio(bandaUid, cotizacionId) {
    if (!bandaUid || !cotizacionId) {
        alert('Datos incompletos');
        return;
    }
    
    const timeConfirmed = new Date().toISOString();
    
    const updates = {};
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/confirmada`] = 'yes';
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/timeConfirmed`] = timeConfirmed;
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/deleteAfterHours`] = 4;
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/confirmada`] = 'yes';
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/timeConfirmed`] = timeConfirmed;
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/deleteAfterHours`] = 4;
    
    try {
        const rootRef = ref(db);
        await update(rootRef, updates);
        alert('Servicio confirmado correctamente');
        document.getElementById('routeInfo').classList.remove('show');
    } catch (error) {
        console.error('Error confirmando servicio:', error);
        alert('Error al confirmar el servicio');
    }
}

// Cancelar servicio
async function cancelarServicio(bandaUid, cotizacionId) {
    if (!bandaUid || !cotizacionId) {
        alert('Datos incompletos');
        return;
    }
    
    if (!confirm('¿Estás seguro de cancelar este servicio?')) {
        return;
    }
    
    const timeNow = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    
    const updates = {};
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/confirmada`] = 'cancel';
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/canceladabanda`] = 'no';
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/canceladauser`] = currentUID;
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/finalizada`] = 'yes';
    updates[`CotizacionBanda/${bandaUid}/${cotizacionId}/timecancelation`] = timeNow;
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/confirmada`] = 'cancel';
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/canceladabanda`] = 'no';
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/canceladauser`] = currentUID;
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/finalizada`] = 'yes';
    updates[`CotizacionComprador/${currentUID}/${cotizacionId}/timecancelation`] = timeNow;
    
    try {
        const rootRef = ref(db);
        await update(rootRef, updates);
        alert('Servicio cancelado correctamente');
        document.getElementById('routeInfo').classList.remove('show');
        if (currentRoutePolyline) {
            currentRoutePolyline.setMap(null);
        }
        if (startMarker) startMarker.setMap(null);
        if (destinationMarker) destinationMarker.setMap(null);
    } catch (error) {
        console.error('Error cancelando servicio:', error);
        alert('Error al cancelar el servicio');
    }
}
