<!DOCTYPE html>
<html lang="es">
<head>
    <!-- PROVIWEB Social Area Auth Guard -->
    <script src="js/social-auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - PROVIWEB</title>
    <link rel="icon" href="assets/logotransparente.png">
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-card: rgba(28, 28, 36, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-purple: #a855f7;
            --gradient-primary: linear-gradient(135deg, #a855f7 0%, #007BFF 100%);
        }
        
        body { 
            font-family: system-ui, sans-serif; 
            max-width: 560px; 
            margin: 40px auto; 
            padding: 20px; 
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        h1 { 
            font-size: 1.5rem; 
            color: var(--text-primary);
        }
        
        .stat { 
            background: var(--bg-card); 
            border: 1px solid var(--border-glass);
            border-radius: 12px; 
            padding: 20px; 
            margin: 16px 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .stat .val { 
            font-size: 2rem; 
            font-weight: 800; 
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat .lab { 
            font-size: 0.875rem; 
            color: var(--text-secondary); 
            margin-top: 4px; 
        }
        
        .countries { 
            margin-top: 12px; 
            font-size: 0.875rem; 
            color: var(--text-secondary); 
        }
        
        .countries span { 
            display: inline-block; 
            margin: 4px 8px 4px 0; 
            padding: 4px 10px; 
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-primary);
        }
        
        .err { 
            color: #ff6b6b; 
        }
        
        a { 
            color: var(--accent-purple);
            text-decoration: none;
        }
        
        a:hover {
            color: #007BFF;
        }

        @media (max-width: 600px) {
            body {
                max-width: none;
                margin: 0;
                padding: 24px 16px 40px;
                font-size: 16px;
            }

            h1 {
                font-size: 1.35rem;
                line-height: 1.25;
            }

            .stat {
                margin: 12px 0;
                padding: 16px;
            }

            .stat .val {
                display: block;
                font-size: 1.75rem;
            }

            .stat .lab {
                display: block;
                margin-top: 6px;
                line-height: 1.5;
            }

            .countries span {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>
    <h1>Estadísticas PROVIWEB</h1>
    <p style="color: var(--text-secondary);">Conteo desde Realtime Database (Users).</p>
    <div id="stats">
        <div class="stat"><span class="val" id="userCount">—</span><span class="lab">Usuarios registrados</span></div>
        <div class="stat">
            <span class="val" id="countryCount">—</span><span class="lab">Países con al menos un usuario (si tienen country/pais/location)</span>
            <div class="countries" id="byCountry"></div>
        </div>
    </div>
    <p id="error" class="err" style="display:none;"></p>
    <p style="margin-top:24px;"><a href="index.html">← Volver al inicio</a></p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxtXQ3a4azqY5yww9TetxouSr7jUdzdNw",
            authDomain: "proviweb-d8764.firebaseapp.com",
            databaseURL: "https://proviweb-d8764-default-rtdb.firebaseio.com",
            projectId: "proviweb-d8764",
            storageBucket: "proviweb-d8764.appspot.com",
            messagingSenderId: "475963980955",
            appId: "1:475963980955:web:8444288d8ba13e428e1a3e"
        };
        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app, "us-central1");

        try {
            const getPublicStats = httpsCallable(functions, "getPublicStats");
            const res = await getPublicStats();
            const data = res.data;
            document.getElementById("userCount").textContent = data.userCount;
            const countries = data.byCountry || {};
            const keys = Object.keys(countries);
            document.getElementById("countryCount").textContent = keys.length;
            const el = document.getElementById("byCountry");
            if (keys.length) {
                keys.sort((a, b) => (countries[b] || 0) - (countries[a] || 0));
                el.innerHTML = keys.map(c => "<span>" + c + ": " + countries[c] + "</span>").join("");
            } else {
                el.textContent = "No hay datos de país en los perfiles (campo country/pais/location).";
            }
        } catch (e) {
            document.getElementById("error").style.display = "block";
            document.getElementById("error").textContent = "Error: " + (e.message || e);
            document.getElementById("userCount").textContent = "—";
            document.getElementById("countryCount").textContent = "—";
        }
    </script>
</body>
</html>
