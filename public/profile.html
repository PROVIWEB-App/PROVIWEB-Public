<!DOCTYPE html>
<html lang="es">
<head>
    <!-- PROVIWEB Social Area Auth Guard -->
    <script src="js/social-auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PROVIWEB</title>
    <link rel="icon" href="./assets/logotransparente-1dd37ce8.png">
    <style>
        body {
            margin: 0;
            background: #0f0f13;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3.5px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loading-spinner" style="margin: 0 auto 16px;"></div>
        <div style="font-size: 14px; font-weight: 600; color: #a0a0b0;">Cargando perfil...</div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const targetUid = params.get('uid') || params.get('id') || params.get('userId') || params.get('uID') || params.get('artistId') || params.get('user');
            const currentUid = localStorage.getItem('id');

            // If no target UID is provided, or the target UID matches the logged-in user, go to myprofile
            if (!targetUid || (currentUid && targetUid === currentUid)) {
                params.delete('uid');
                params.delete('id');
                params.delete('userId');
                params.delete('uID');
                params.delete('artistId');
                params.delete('user');
                const remaining = params.toString();
                window.location.replace('myprofile.html' + (remaining ? '?' + remaining : ''));
            } else {
                // Another user's profile -> route to userprofile.html
                params.set('uid', targetUid);
                params.delete('id');
                params.delete('userId');
                params.delete('uID');
                params.delete('artistId');
                params.delete('user');
                window.location.replace('userprofile.html?' + params.toString());
            }
        })();
    </script>
</body>
</html>
