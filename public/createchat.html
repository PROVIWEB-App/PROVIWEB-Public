<!DOCTYPE html>
<html lang="es">
<head>
    <!-- PROVIWEB Social Area Auth Guard -->
    <script src="js/social-auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes y Chats - PROVIWEB</title>
    <link rel="icon" href="assets/logotransparente.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(22, 22, 32, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent-purple: #a855f7;
            --gradient-primary: linear-gradient(135deg, #a855f7 0%, #007BFF 100%);
            --border-radius: 16px;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .chat-hub-container {
            max-width: 680px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
        }

        /* Top Header */
        .chat-hub-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }

        .chat-hub-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        /* Tab Switcher */
        .chat-tabs-bar {
            display: flex;
            padding: 12px 20px 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-glass);
            gap: 16px;
        }

        .chat-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 700;
            padding: 10px 14px 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .chat-tab-btn.active {
            color: #ffffff;
        }

        .chat-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: 3px 3px 0 0;
        }

        /* Search input */
        .search-box-wrap {
            padding: 16px 20px;
            background: var(--bg-secondary);
        }

        .search-chat-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 10px 18px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .search-chat-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        /* Conversation / User List */
        .chat-list-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 30px;
        }

        .chat-row-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .chat-row-item:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.25);
            transform: translateX(4px);
        }

        .avatar-wrap {
            position: relative;
        }

        .user-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            border: 2px solid var(--bg-secondary);
        }

        .chat-item-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-item-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .chat-item-msg-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unread-badge-pill {
            background: var(--accent-purple);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .empty-chats-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
        }
    </style>
</head>
<body>

    <div class="chat-hub-container">
        <!-- Header -->
        <header class="chat-hub-header">
            <div class="header-title-box">
                <a href="home.html" class="back-icon-btn" title="Volver al Inicio">←</a>
                <h1 class="chat-hub-title">💬 Mensajes</h1>
            </div>
            <a href="home.html" style="color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600;">Inicio</a>
        </header>

        <!-- Tabs: Chats Activos vs Todos los Contactos -->
        <div class="chat-tabs-bar">
            <button type="button" class="chat-tab-btn active" id="tabRecentChats">Recientes</button>
            <button type="button" class="chat-tab-btn" id="tabAllContacts">Nuevo Chat / Contactos</button>
        </div>

        <!-- Search Bar -->
        <div class="search-box-wrap">
            <input type="text" id="chatSearchInput" class="search-chat-input" placeholder="🔍 Buscar por nombre o @usuario...">
        </div>

        <!-- Content List -->
        <main class="chat-list-content" id="chatListContainer">
            <div class="empty-chats-state">
                <div style="font-size: 32px; margin-bottom: 10px;">⏳</div>
                <div>Cargando conversaciones...</div>
            </div>
        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, get, set, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { firebaseConfig } from "./js/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUID = null;
        let activeTab = 'recent'; // 'recent' | 'contacts'
        let recentChatlistData = [];
        let allUsersData = [];

        const container = document.getElementById('chatListContainer');
        const tabRecent = document.getElementById('tabRecentChats');
        const tabContacts = document.getElementById('tabAllContacts');
        const searchInput = document.getElementById('chatSearchInput');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html?redirect=createchat.html';
                return;
            }
            currentUID = user.uid;

            // Marcar estado Online y desconexión
            update(ref(db, `Users/${currentUID}`), { status: 'online' });
            onDisconnect(ref(db, `Users/${currentUID}`)).update({ status: Date.now().toString() });

            loadRecentChats();
            loadAllUsers();
        });

        // 1. Cargar Conversaciones Recientes desde Chatlist/{uid}
        function loadRecentChats() {
            onValue(ref(db, `Chatlist/${currentUID}`), async (snapshot) => {
                if (!snapshot.exists()) {
                    recentChatlistData = [];
                    if (activeTab === 'recent') renderRecentChats();
                    return;
                }

                const list = [];
                const promises = [];

                snapshot.forEach(child => {
                    const item = child.val();
                    const targetUid = child.key;

                    promises.push((async () => {
                        const userSnap = await get(ref(db, `Users/${targetUid}`));
                        const uData = userSnap.exists() ? userSnap.val() : { name: 'Usuario', photo: 'assets/avatar.png' };
                        list.push({
                            targetUid: targetUid,
                            lastMsg: item.lastMsg || 'Mensaje',
                            timestamp: parseInt(item.timestamp || 0),
                            type: item.type || 'text',
                            isSeen: item.isSeen !== false,
                            userData: uData
                        });
                    })());
                });

                await Promise.all(promises);

                // Ordenar por fecha más reciente
                list.sort((a, b) => b.timestamp - a.timestamp);
                recentChatlistData = list;

                if (activeTab === 'recent') {
                    renderRecentChats();
                }
            });
        }

        // 2. Cargar Todos los Usuarios para Iniciar Nuevo Chat
        async function loadAllUsers() {
            const usersSnap = await get(ref(db, 'Users'));
            const list = [];
            if (usersSnap.exists()) {
                usersSnap.forEach(child => {
                    if (child.key !== currentUID) {
                        const u = child.val();
                        if (u.name || u.username) {
                            list.push({
                                uid: child.key,
                                ...u
                            });
                        }
                    }
                });
            }
            allUsersData = list;
            if (activeTab === 'contacts') {
                renderAllContacts();
            }
        }

        function renderRecentChats() {
            const query = searchInput.value.trim().toLowerCase();
            let filtered = recentChatlistData;

            if (query) {
                filtered = filtered.filter(item => 
                    (item.userData.name && item.userData.name.toLowerCase().includes(query)) ||
                    (item.userData.username && item.userData.username.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-chats-state">
                        <div style="font-size: 36px; margin-bottom: 10px;">💬</div>
                        <div style="font-weight: 700; font-size: 16px;">No tienes conversaciones recientes</div>
                        <p style="font-size: 13px; margin: 8px 0 20px 0;">Inicia una conversación con cualquier músico o comercio.</p>
                        <button type="button" class="btn-primary-action" onclick="document.getElementById('tabAllContacts').click();" style="border:none; padding:8px 18px; border-radius:20px; font-weight:700; cursor:pointer; background:var(--gradient-primary); color:#fff;">Explorar Contactos</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(item => {
                const u = item.userData;
                const isOnline = u.status === 'online';
                const timeAgo = formatTimeAgo(item.timestamp);

                const row = document.createElement('a');
                row.className = 'chat-row-item';
                row.href = `chat.html?hisUID=${item.targetUid}`;

                let snippet = item.lastMsg;
                if (item.type === 'image') snippet = '📷 Foto';
                else if (item.type === 'audio') snippet = '🎵 Nota de voz';
                else if (item.type === 'video') snippet = '🎬 Video';
                else if (item.type === 'sheet_music') snippet = '🎼 Partitura';

                row.innerHTML = `
                    <div class="avatar-wrap">
                        <img src="${u.photo || 'assets/avatar.png'}" alt="Avatar" class="user-avatar-img">
                        ${isOnline ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="chat-item-info">
                        <div class="chat-item-top">
                            <span class="chat-item-name">${u.name || 'Usuario'}</span>
                            <span class="chat-item-time">${timeAgo}</span>
                        </div>
                        <div class="chat-item-msg-preview">
                            <span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${snippet}</span>
                            ${!item.isSeen ? '<span class="unread-badge-pill">Nuevo</span>' : ''}
                        </div>
                    </div>
                `;

                container.appendChild(row);
            });
        }

        function renderAllContacts() {
            const query = searchInput.value.trim().toLowerCase();
            let filtered = allUsersData;

            if (query) {
                filtered = filtered.filter(u => 
                    (u.name && u.name.toLowerCase().includes(query)) ||
                    (u.username && u.username.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-chats-state">
                        <div style="font-size: 32px; margin-bottom: 10px;">🔍</div>
                        <div>No se encontraron usuarios</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(u => {
                const isOnline = u.status === 'online';

                const row = document.createElement('a');
                row.className = 'chat-row-item';
                row.href = `chat.html?hisUID=${u.uid}`;

                row.innerHTML = `
                    <div class="avatar-wrap">
                        <img src="${u.photo || 'assets/avatar.png'}" alt="Avatar" class="user-avatar-img">
                        ${isOnline ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="chat-item-info">
                        <div class="chat-item-top">
                            <span class="chat-item-name">${u.name || 'Usuario'}</span>
                            <span style="font-size:12px; color:var(--text-secondary);">@${u.username || 'usuario'}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted);">${u.bio || (isOnline ? 'En línea' : 'Toca para chatear')}</div>
                    </div>
                `;

                container.appendChild(row);
            });
        }

        function formatTimeAgo(ts) {
            if (!ts) return '';
            const diff = Date.now() - ts;
            if (diff < 60000) return 'ahora';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h`;
            return `${Math.floor(diff / 86400000)}d`;
        }

        // Tab Switching
        tabRecent.addEventListener('click', () => {
            tabRecent.classList.add('active');
            tabContacts.classList.remove('active');
            activeTab = 'recent';
            renderRecentChats();
        });

        tabContacts.addEventListener('click', () => {
            tabContacts.classList.add('active');
            tabRecent.classList.remove('active');
            activeTab = 'contacts';
            renderAllContacts();
        });

        searchInput.addEventListener('input', () => {
            if (activeTab === 'recent') renderRecentChats();
            else renderAllContacts();
        });
    </script>
