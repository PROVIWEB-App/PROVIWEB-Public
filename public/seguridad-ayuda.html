function render(countryCode) {
    var container = document.getElementById('helpCards');
    var empty = document.getElementById('emptyState');
    var vetSection = document.getElementById('vetSection');
    var vetCards = document.getElementById('vetCards');
    if (!countryCode || !DATA[countryCode]) {
        empty.style.display = 'block';
        vetSection.style.display = 'none';
        [].slice.call(container.querySelectorAll('.help-card')).forEach(function(el) { el.remove(); });
        vetCards.innerHTML = '';
        return;
    }
    empty.style.display = 'none';
    container.querySelectorAll('.help-card').forEach(function(el) { el.remove(); });
    DATA[countryCode].forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'help-card';
        card.innerHTML = '<h3>' + item.icon + ' ' + item.title + '</h3>' +
            '<div class="number">' + item.number + '</div>' +
            '<p class="note">' + item.note + '</p>';
        container.appendChild(card);
    });
    if (VET_CLINICS[countryCode]) {
        vetSection.style.display = 'block';
        vetCards.innerHTML = '';
        VET_CLINICS[countryCode].forEach(function(v) {
            var vc = document.createElement('div');
            vc.className = 'vet-card';
            vc.innerHTML = '<div><span class="vet-name">' + v.name + '</span><br><span class="vet-place">' + v.place + '</span></div>' +
                (v.phone ? '<span class="vet-phone">' + v.phone + '</span>' : '') +
                (v.note ? '<span class="vet-note">' + v.note + '</span>' : '');
            vetCards.appendChild(vc);
        });
    } else {
        vetSection.style.display = 'none';
        vetCards.innerHTML = '';
    }
}

document.getElementById('country').addEventListener('change', function() {
    render(this.value);
});
