<!DOCTYPE html>
<html lang="es">
<head>
    <!-- PROVIWEB Social Area Auth Guard -->
    <script src="js/social-auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels - PROVIWEB</title>
    <link rel="icon" type="image/x-icon" href="assets/logotransparente.png">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Top Header Bar */
        .reels-top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: auto;
        }

        .reels-nav-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .reels-nav-btn:hover {
            background: rgba(168, 85, 247, 0.8);
            transform: scale(1.05);
        }

        .reels-title-tab {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Reels Vertical Container */
        .reels-feed-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .reels-feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Single Reel Card */
        .reel-screen-card {
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050508;
            overflow: hidden;
        }

        .reel-video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-width: 500px;
            background: #000000;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .reel-video-element {
                border-radius: 20px;
                height: 94vh;
                margin: auto;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
        }

        /* Overlays & Content Area */
        .reel-overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 20px 30px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 60%, rgba(0, 0, 0, 0) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .reel-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            pointer-events: auto;
        }

        .reel-author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #a855f7;
            object-fit: cover;
            cursor: pointer;
        }

        .reel-author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reel-author-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reel-author-username {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .reel-follow-btn {
            margin-left: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .reel-follow-btn.following {
            background: rgba(168, 85, 247, 0.4);
            border-color: #a855f7;
        }

        .reel-caption-text {
            font-size: 14px;
            line-height: 1.4;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            word-break: break-word;
        }

        .reel-audio-track-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
        }

        /* Right Action Bar */
        .reel-actions-sidebar {
            position: absolute;
            right: 16px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 30;
        }

        @media (min-width: 768px) {
            .reel-actions-sidebar {
                right: calc(50% - 240px);
            }
        }

        .reel-action-btn-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .reel-action-btn-item:hover {
            transform: scale(1.15);
        }

        .reel-action-icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(20, 20, 30, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .reel-action-btn-item.liked .reel-action-icon-circle {
            background: rgba(244, 63, 94, 0.85);
            border-color: #f43f5e;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.6);
        }

        .reel-action-count {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* Vinyl Disc Rotating Animation */
        .reel-vinyl-disc {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #2d2d38 30%, #111116 70%, #000 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            animation: rotateVinyl 4s linear infinite;
        }

        .reel-vinyl-disc.paused {
            animation-play-state: paused;
        }

        .reel-vinyl-disc img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }

        @keyframes rotateVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Double Tap Heart Burst */
        .heart-burst-anim {
            position: absolute;
            font-size: 80px;
            pointer-events: none;
            z-index: 50;
            animation: heartBurst 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes heartBurst {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.6) translateY(-40px) rotate(15deg); }
        }

        /* Loading Screen & Empty State */
        .reels-loading-box {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #07070b;
            z-index: 10;
        }

        .reels-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Comments Modal */
        .reels-comments-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60vh;
            max-width: 550px;
            margin: 0 auto;
            background: rgba(20, 20, 28, 0.95);
            backdrop-filter: blur(20px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
        }

        .reels-comments-modal.open {
            transform: translateY(0);
        }

        .comments-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comments-modal-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-row-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .comment-avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-bubble-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
        }

        .comment-user-name {
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 2px;
        }

        .comment-input-bottom-bar {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 10, 15, 0.9);
        }

        .comment-input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .comment-send-action-btn {
            background: linear-gradient(135deg, #a855f7, #007BFF);
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header flotante -->
    <header class="reels-top-nav">
        <a href="home.html" class="reels-nav-btn" title="Volver al inicio">✕</a>
        <div class="reels-title-tab">
            <span>🎬</span> Reels PROVIWEB
        </div>
        <a href="createpost.html?type=reel" class="reels-nav-btn" title="Subir nuevo Reel">➕</a>
    </header>

    <!-- Contenedor vertical de Reels -->
    <main class="reels-feed-container" id="reelsFeed">
        <div class="reels-loading-box" id="reelsLoading">
            <div class="reels-spinner"></div>
            <div>Cargando Reels...</div>
        </div>
    </main>

    <!-- Modal de Comentarios para Reels -->
    <div class="reels-comments-modal" id="reelsCommentsModal">
        <div class="comments-modal-header">
            <div style="font-weight: 700; font-size: 16px;">Comentarios</div>
            <button type="button" id="closeCommentsModalBtn" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">&times;</button>
        </div>
        <div class="comments-modal-list" id="commentsModalList">
            <div style="text-align: center; color: rgba(255,255,255,0.5); padding: 20px;">Cargando comentarios...</div>
        </div>
        <div class="comment-input-bottom-bar">
            <input type="text" id="reelCommentInput" class="comment-input-field" placeholder="Añade un comentario...">
            <button type="button" id="sendReelCommentBtn" class="comment-send-action-btn">Enviar</button>
        </div>
    </div>

    <!-- Scripts Firebase y Reproductor -->
    <script src="js/post-media.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set, push, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { firebaseConfig } from "./js/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUID = null;
        let activeReelId = null;
        let reelsDataList = [];
        const container = document.getElementById('reelsFeed');
        const loadingBox = document.getElementById('reelsLoading');
        const commentsModal = document.getElementById('reelsCommentsModal');
        const commentsList = document.getElementById('commentsModalList');
        const commentInput = document.getElementById('reelCommentInput');
        const sendCommentBtn = document.getElementById('sendReelCommentBtn');
        const closeCommentsBtn = document.getElementById('closeCommentsModalBtn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUID = user.uid;
            }
            loadReels();
        });

        async function loadReels() {
            const reelsRef = ref(db, 'Reels');
            onValue(reelsRef, (snapshot) => {
                if (!snapshot.exists()) {
                    loadingBox.innerHTML = `
                        <div style="font-size: 32px;">🎬</div>
                        <div style="font-weight: 700;">No hay reels disponibles</div>
                        <a href="createpost.html?type=reel" class="reels-nav-btn" style="width: auto; padding: 8px 18px; border-radius: 20px;">¡Sé el primero en subir un Reel!</a>
                    `;
                    return;
                }

                loadingBox.style.display = 'none';
                container.innerHTML = '';

                const list = [];
                snapshot.forEach((childSnap) => {
                    const data = childSnap.val();
                    const videoUrl = data.video || data.videoUrl || data.mediaUrl || '';
                    if (videoUrl && videoUrl !== 'noVideo') {
                        list.push({
                            id: childSnap.key,
                            ...data
                        });
                    }
                });

                // Ordenar por fecha más reciente
                list.sort((a, b) => (b.pTime || 0) - (a.pTime || 0));
                reelsDataList = list;

                list.forEach((reel, index) => {
                    const card = createReelCard(reel, index);
                    container.appendChild(card);
                });

                setupIntersectionObserver();
            });
        }

        function createReelCard(reel, index) {
            const card = document.createElement('div');
            card.className = 'reel-screen-card';
            card.id = `reelCard_${reel.id}`;
            card.dataset.reelId = reel.id;

            const authorId = reel.id || reel.uid || '';
            const videoUrl = reel.video || reel.videoUrl || '';
            const caption = reel.text || reel.caption || '';
            const songTitle = reel.audioTitle || reel.songTitle || 'Audio original';

            card.innerHTML = `
                <video class="reel-video-element" loop playsinline preload="${index < 2 ? 'auto' : 'metadata'}" src="${videoUrl}"></video>
                
                <div class="reel-overlay-bottom">
                    <div class="reel-author-row">
                        <img class="reel-author-avatar" src="assets/avatar.png" alt="Avatar">
                        <div class="reel-author-info">
                            <a class="reel-author-name" href="userprofile.html?uid=${authorId}">
                                <span class="author-name-text">Artista</span>
                            </a>
                            <span class="reel-author-username">@artista</span>
                        </div>
                        <button type="button" class="reel-follow-btn">+ Seguir</button>
                    </div>
                    <div class="reel-caption-text">${caption}</div>
                    <div class="reel-audio-track-tag">
                        <span>🎵</span> <span>${songTitle}</span>
                    </div>
                </div>

                <div class="reel-actions-sidebar">
                    <button type="button" class="reel-action-btn-item like-btn" data-action="like">
                        <div class="reel-action-icon-circle">❤️</div>
                        <span class="reel-action-count like-count">0</span>
                    </button>

                    <button type="button" class="reel-action-btn-item comment-btn" data-action="comment">
                        <div class="reel-action-icon-circle">💬</div>
                        <span class="reel-action-count comment-count">0</span>
                    </button>

                    <button type="button" class="reel-action-btn-item share-btn" data-action="share">
                        <div class="reel-action-icon-circle">↗️</div>
                        <span class="reel-action-count">Compartir</span>
                    </button>

                    <div class="reel-vinyl-disc">
                        <img src="assets/logotransparente.png" alt="Audio">
                    </div>
                </div>
            `;

            const video = card.querySelector('.reel-video-element');
            const avatar = card.querySelector('.reel-author-avatar');
            const nameEl = card.querySelector('.author-name-text');
            const userEl = card.querySelector('.reel-author-username');
            const followBtn = card.querySelector('.reel-follow-btn');
            const likeBtn = card.querySelector('.like-btn');
            const likeCountEl = card.querySelector('.like-count');
            const commentBtn = card.querySelector('.comment-btn');
            const commentCountEl = card.querySelector('.comment-count');
            const shareBtn = card.querySelector('.share-btn');
            const vinyl = card.querySelector('.reel-vinyl-disc');

            // Cargar datos del autor
            if (authorId) {
                onValue(ref(db, `Users/${authorId}`), (userSnap) => {
                    if (userSnap.exists()) {
                        const u = userSnap.val();
                        if (u.photo) avatar.src = u.photo;
                        nameEl.textContent = u.name || 'Artista';
                        userEl.textContent = `@${u.username || 'usuario'}`;
                    }
                }, { onlyOnce: true });

                // Seguir / Siguiendo
                if (currentUID && currentUID !== authorId) {
                    const followRef = ref(db, `Follow/${authorId}/Followers/${currentUID}`);
                    onValue(followRef, (snap) => {
                        if (snap.exists()) {
                            followBtn.textContent = 'Siguiendo';
                            followBtn.classList.add('following');
                        } else {
                            followBtn.textContent = '+ Seguir';
                            followBtn.classList.remove('following');
                        }
                    });

                    followBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const snap = await get(followRef);
                        if (snap.exists()) {
                            await remove(followRef);
                        } else {
                            await set(followRef, true);
                        }
                    });
                } else {
                    followBtn.style.display = 'none';
                }
            }

            // Sincronizar Likes desde Reels/{reelId}/Likes
            const likesRef = ref(db, `Reels/${reel.id}/Likes`);
            onValue(likesRef, (snap) => {
                const count = snap.exists() ? Object.keys(snap.val()).length : 0;
                likeCountEl.textContent = count;
                if (currentUID && snap.exists() && snap.hasChild(currentUID)) {
                    likeBtn.classList.add('liked');
                } else {
                    likeBtn.classList.remove('liked');
                }
            });

            // Toggle Like
            async function toggleLike() {
                if (!currentUID) return;
                const userLikeRef = ref(db, `Reels/${reel.id}/Likes/${currentUID}`);
                const snap = await get(userLikeRef);
                if (snap.exists()) {
                    await remove(userLikeRef);
                } else {
                    await set(userLikeRef, true);
                    showHeartBurst(card);
                }
            }

            likeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleLike();
            });

            // Doble toque para dar like
            let lastTap = 0;
            video.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    toggleLike();
                } else {
                    if (video.paused) {
                        video.play();
                        vinyl.classList.remove('paused');
                    } else {
                        video.pause();
                        vinyl.classList.add('paused');
                    }
                }
                lastTap = now;
            });

            // Contador de Comentarios
            const commentsRef = ref(db, `Reels/${reel.id}/Comments`);
            onValue(commentsRef, (snap) => {
                const count = snap.exists() ? Object.keys(snap.val()).length : 0;
                commentCountEl.textContent = count;
            });

            // Abrir Comentarios
            commentBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openReelComments(reel.id);
            });

            // Compartir
            shareBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (navigator.share) {
                    navigator.share({
                        title: 'Reel en PROVIWEB',
                        text: caption,
                        url: window.location.href
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert('¡Enlace del Reel copiado al portapapeles!');
                }
            });

            return card;
        }

        function showHeartBurst(card) {
            const heart = document.createElement('div');
            heart.className = 'heart-burst-anim';
            heart.textContent = '❤️';
            card.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    const video = entry.target.querySelector('video');
                    const vinyl = entry.target.querySelector('.reel-vinyl-disc');
                    if (entry.isIntersecting) {
                        activeReelId = entry.target.dataset.reelId;
                        if (video) {
                            video.play().catch(() => {});
                            if (vinyl) vinyl.classList.remove('paused');
                        }
                    } else {
                        if (video) {
                            video.pause();
                            video.currentTime = 0;
                            if (vinyl) vinyl.classList.add('paused');
                        }
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.reel-screen-card').forEach((el) => observer.observe(el));
        }

        // Navegación con teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                container.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
            } else if (e.key === 'ArrowUp') {
                container.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
            } else if (e.key === ' ') {
                e.preventDefault();
                const activeCard = document.querySelector(`.reel-screen-card[data-reel-id="${activeReelId}"]`);
                if (activeCard) {
                    const vid = activeCard.querySelector('video');
                    if (vid) {
                        if (vid.paused) vid.play();
                        else vid.pause();
                    }
                }
            }
        });

        // Comentarios Modal
        function openReelComments(reelId) {
            activeReelId = reelId;
            commentsModal.classList.add('open');
            commentsList.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.5); padding: 20px;">Cargando comentarios...</div>';

            const commentsRef = ref(db, `Reels/${reelId}/Comments`);
            onValue(commentsRef, (snapshot) => {
                if (!snapshot.exists()) {
                    commentsList.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.5); padding: 20px;">Sé el primero en comentar.</div>';
                    return;
                }

                commentsList.innerHTML = '';
                snapshot.forEach((childSnap) => {
                    const c = childSnap.val();
                    const row = document.createElement('div');
                    row.className = 'comment-row-item';
                    row.innerHTML = `
                        <img class="comment-avatar-img" src="assets/avatar.png" alt="Avatar">
                        <div class="comment-bubble-box">
                            <div class="comment-user-name">${c.authorName || 'Usuario'}</div>
                            <div>${c.text || ''}</div>
                        </div>
                    `;
                    if (c.authorId) {
                        onValue(ref(db, `Users/${c.authorId}`), (uSnap) => {
                            if (uSnap.exists()) {
                                const u = uSnap.val();
                                if (u.photo) row.querySelector('.comment-avatar-img').src = u.photo;
                                if (u.name) row.querySelector('.comment-user-name').textContent = u.name;
                            }
                        }, { onlyOnce: true });
                    }
                    commentsList.appendChild(row);
                });
            });
        }

        closeCommentsBtn.addEventListener('click', () => {
            commentsModal.classList.remove('open');
        });

        sendCommentBtn.addEventListener('click', async () => {
            const text = commentInput.value.trim();
            if (!text || !currentUID || !activeReelId) return;

            let authorName = 'Usuario';
            const userSnap = await get(ref(db, `Users/${currentUID}`));
            if (userSnap.exists()) {
                authorName = userSnap.val().name || 'Usuario';
            }

            const commentsRef = ref(db, `Reels/${activeReelId}/Comments`);
            const newCommentRef = push(commentsRef);
            await set(newCommentRef, {
                authorId: currentUID,
                authorName: authorName,
                text: text,
                timestamp: Date.now()
            });

            commentInput.value = '';
        });
    </script>
</body>
</html>
