<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <style media="screen">
      :root {
        --bg-primary: #0f0f13;
        --bg-card: rgba(28, 28, 36, 0.7);
        --border-glass: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: #a0a0b0;
        --accent-purple: #a855f7;
        --gradient-primary: linear-gradient(135deg, #a855f7 0%, #007BFF 100%);
        --gradient-secondary: linear-gradient(135deg, #8b5cf6 0%, #007BFF 100%);
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 999px; }
      ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--gradient-secondary); }
      
      body { 
        background: var(--bg-primary); 
        color: var(--text-secondary); 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        margin: 0; 
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #message { 
        background: var(--bg-card); 
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
        max-width: 360px; 
        margin: 100px auto 16px; 
        padding: 32px 24px 16px; 
        border-radius: 16px; 
      }
      #message h3 { 
        color: var(--text-secondary); 
        font-weight: normal; 
        font-size: 16px; 
        margin: 16px 0 12px; 
      }
      #message h2 { 
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: bold; 
        font-size: 48px; 
        margin: 0 0 8px; 
        text-align: center;
      }
      #message h1 { 
        font-size: 22px; 
        font-weight: 300; 
        color: var(--text-primary); 
        margin: 0 0 16px;
        text-align: center;
      }
      #message p { 
        line-height: 140%; 
        margin: 16px 0 24px; 
        font-size: 14px; 
      }
      #message a { 
        display: block; 
        text-align: center; 
        background: var(--gradient-primary); 
        text-transform: uppercase; 
        text-decoration: none; 
        color: var(--text-primary); 
        padding: 16px; 
        border-radius: 8px; 
        font-weight: 500;
        transition: opacity 0.2s ease;
      }
      #message a:hover {
        opacity: 0.9;
      }
      #load { 
        color: var(--text-secondary); 
        text-align: center; 
        font-size: 13px; 
      }
      @media (max-width: 600px) {
        body, #message { 
          margin-top: 0; 
        }
        body { 
          padding: 16px;
        }
        #message {
          margin: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <h3>Why am I seeing this?</h3>
      <p>This page was generated by the Firebase Command-Line Interface. To modify it, edit the <code>404.html</code> file in your project's configured <code>public</code> directory.</p>
    </div>
  </body>
</html>
